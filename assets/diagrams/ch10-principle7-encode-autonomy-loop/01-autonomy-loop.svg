<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Apple SD Gothic Neo, sans-serif">
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6.2" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6.2,3 L0,6 Z" fill="#2D6CDF"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6.2" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6.2,3 L0,6 Z" fill="#36B37E"/>
    </marker>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="6.2" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6.2,3 L0,6 Z" fill="#5B6B7A"/>
    </marker>
    <pattern id="dot-field" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.2" fill="#2D6CDF" opacity="0.12"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1200" height="640" fill="#F7F9FC"/>
  <rect x="42" y="104" width="1116" height="404" fill="url(#dot-field)" opacity="0.7"/>

  <text x="600" y="50" text-anchor="middle" font-size="27" font-weight="700" fill="#1B2733">원칙 7 — 한 프롬프트가 닫힌 자율 루프를 돈다</text>
  <text x="600" y="82" text-anchor="middle" font-size="16" fill="#5B6B7A">검증·복구가 인코딩돼 있어야 루프가 끊기지 않는다 · 사람은 판단에만</text>

  <rect x="850" y="114" width="295" height="62" rx="15" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="997.5" y="141" text-anchor="middle" font-size="15" font-weight="700" fill="#1B2733">사람 — 판단 필요할 때만</text>
  <text x="997.5" y="161" text-anchor="middle" font-size="13" fill="#5B6B7A">에스컬레이션 (원칙 1)</text>

  <text x="50" y="222" font-size="11" font-weight="700" letter-spacing="1.4" fill="#2D6CDF">PROMPT</text>
  <text x="50" y="242" font-size="14" font-weight="700" fill="#1B2733">프롬프트</text>
  <line x1="50" y1="252" x2="50" y2="272" stroke="#2D6CDF" stroke-width="2.8" marker-end="url(#arrow-blue)"/>

  <rect x="40" y="278" width="190" height="86" rx="16" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="2"/>
  <text x="135" y="314" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1B2733">상태 검증 · 계획</text>
  <text x="135" y="338" text-anchor="middle" font-size="12.5" fill="#5B6B7A">(원칙 1 · 4)</text>

  <rect x="270" y="278" width="170" height="86" rx="16" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="2"/>
  <text x="355" y="326" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1B2733">구현</text>

  <rect x="480" y="278" width="200" height="86" rx="16" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="2"/>
  <text x="580" y="314" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1B2733">검증 — 앱 실행·테스트</text>
  <text x="580" y="338" text-anchor="middle" font-size="12.5" fill="#5B6B7A">(원칙 2)</text>

  <rect x="720" y="278" width="180" height="86" rx="16" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="2"/>
  <text x="810" y="314" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1B2733">강제 — 린터·테스트</text>
  <text x="810" y="338" text-anchor="middle" font-size="12.5" fill="#5B6B7A">(원칙 5)</text>

  <rect x="940" y="278" width="210" height="86" rx="16" fill="#FFFFFF" stroke="#36B37E" stroke-width="2.5"/>
  <text x="1045" y="314" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1B2733">PR → ✓ 병합</text>
  <text x="1045" y="338" text-anchor="middle" font-size="12.5" fill="#5B6B7A">(원칙 6)</text>

  <line x1="230" y1="321" x2="264" y2="321" stroke="#36B37E" stroke-width="3" marker-end="url(#arrow-green)"/>
  <line x1="440" y1="321" x2="474" y2="321" stroke="#36B37E" stroke-width="3" marker-end="url(#arrow-green)"/>
  <line x1="680" y1="321" x2="714" y2="321" stroke="#36B37E" stroke-width="3" marker-end="url(#arrow-green)"/>
  <line x1="900" y1="321" x2="934" y2="321" stroke="#36B37E" stroke-width="3" marker-end="url(#arrow-green)"/>

  <text x="235" y="302" font-size="9.5" font-weight="700" letter-spacing="1.1" fill="#36B37E">PASS</text>
  <text x="445" y="302" font-size="9.5" font-weight="700" letter-spacing="1.1" fill="#36B37E">PASS</text>
  <text x="685" y="302" font-size="9.5" font-weight="700" letter-spacing="1.1" fill="#36B37E">PASS</text>
  <text x="905" y="302" font-size="9.5" font-weight="700" letter-spacing="1.1" fill="#36B37E">PASS</text>

  <line x1="1045" y1="278" x2="1045" y2="180" stroke="#5B6B7A" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#arrow-gray)"/>
  <text x="1060" y="226" font-size="10" font-weight="700" letter-spacing="1.2" fill="#5B6B7A" transform="rotate(-90 1060 226)">ESCALATE</text>

  <path d="M 1045 364 C 1045 462, 580 462, 580 369" fill="none" stroke="#2D6CDF" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="812" y="493" text-anchor="middle" font-size="15" font-weight="700" fill="#2D6CDF">복구: 빌드 실패 감지 → 자가 수정 → 다시 검증</text>
  <text x="812" y="516" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1.3" fill="#5B6B7A">FROM PR RESULT ┄▶ TO VERIFICATION</text>

  <line x1="112" y1="548" x2="1088" y2="548" stroke="#D8E2F0" stroke-width="1"/>
  <text x="600" y="588" text-anchor="middle" font-size="16" fill="#1B2733">자율은 <tspan font-weight="700" fill="#E5484D">모델 신뢰</tspan>가 아니라 <tspan font-weight="700" fill="#2D6CDF">인코딩된 검증·복구 루프</tspan>의 결과 — 한 단계라도 끊기면 거기서 사람을 기다린다</text>
</svg>