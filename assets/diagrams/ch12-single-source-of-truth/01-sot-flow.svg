<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="Apple SD Gothic Neo, sans-serif">
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2D6CDF"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#36B37E"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#E5484D"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="660" fill="#F7F9FC"/>

  <g opacity="0.22" fill="#2D6CDF">
    <circle cx="74" cy="92" r="2"/>
    <circle cx="112" cy="76" r="1.5"/>
    <circle cx="154" cy="104" r="1.8"/>
    <circle cx="1036" cy="94" r="2"/>
    <circle cx="1088" cy="72" r="1.6"/>
    <circle cx="1126" cy="112" r="1.8"/>
    <circle cx="76" cy="552" r="1.7"/>
    <circle cx="118" cy="594" r="2"/>
    <circle cx="1110" cy="548" r="1.8"/>
    <circle cx="1150" cy="586" r="1.5"/>
  </g>

  <text x="600" y="48" text-anchor="middle" font-size="27" font-weight="700" fill="#1B2733">진실의 원천(SoT) — 단방향 생성과 점검 루프</text>
  <text x="600" y="80" text-anchor="middle" font-size="16" fill="#5B6B7A">권위는 한 곳. 파생물은 거기서 생성되거나 거기를 가리킨다</text>

  <g>
    <text x="84" y="122" font-size="10" font-weight="700" letter-spacing="1.2" fill="#5B6B7A">EDIT FROM SOT</text>
    <rect x="84" y="132" width="320" height="70" rx="15" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="2" stroke-dasharray="6 7"/>
    <text x="244" y="161" text-anchor="middle" font-size="15" font-weight="700" fill="#1B2733">고칠 땐 SoT를 먼저</text>
    <text x="244" y="181" text-anchor="middle" font-size="13" fill="#5B6B7A">순서가 바뀌면 드리프트가 생긴다</text>
    <line x1="244" y1="202" x2="244" y2="244" stroke="#2D6CDF" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
  </g>

  <g>
    <rect x="80" y="248" width="330" height="216" rx="16" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="2.5"/>
    <text x="245" y="286" text-anchor="middle" font-size="18" font-weight="700" fill="#1B2733">SoT</text>
    <text x="245" y="310" text-anchor="middle" font-size="14" fill="#5B6B7A">권위 있는 한 곳</text>

    <rect x="112" y="326" width="266" height="44" rx="14" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="2"/>
    <text x="245" y="354" text-anchor="middle" font-size="15" font-weight="700" fill="#1B2733">structure.json</text>

    <rect x="112" y="382" width="266" height="44" rx="14" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="2"/>
    <text x="245" y="410" text-anchor="middle" font-size="15" font-weight="700" fill="#1B2733">facts.md</text>

    <rect x="112" y="438" width="266" height="44" rx="14" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="2"/>
    <text x="245" y="466" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1B2733">진행 상태 메타데이터</text>
  </g>

  <g>
    <rect x="760" y="170" width="310" height="78" rx="16" fill="#FFFFFF" stroke="#36B37E" stroke-width="2"/>
    <text x="915" y="204" text-anchor="middle" font-size="16" font-weight="700" fill="#1B2733">문서·페이지</text>
    <text x="915" y="226" text-anchor="middle" font-size="13" fill="#5B6B7A">구조 SoT에서 생성</text>

    <rect x="760" y="292" width="310" height="78" rx="16" fill="#FFFFFF" stroke="#36B37E" stroke-width="2"/>
    <text x="915" y="326" text-anchor="middle" font-size="16" font-weight="700" fill="#1B2733">본문</text>
    <text x="915" y="348" text-anchor="middle" font-size="13" fill="#5B6B7A">반복 사실 SoT를 인용</text>

    <rect x="760" y="414" width="310" height="88" rx="16" fill="#FFFFFF" stroke="#36B37E" stroke-width="2"/>
    <text x="915" y="448" text-anchor="middle" font-size="16" font-weight="700" fill="#1B2733">별도 매니페스트 없이 생성</text>
    <text x="915" y="470" text-anchor="middle" font-size="13" fill="#5B6B7A">각 항목 메타데이터를 스캔</text>
  </g>

  <g stroke-linecap="round" stroke-linejoin="round">
    <line x1="378" y1="348" x2="754" y2="209" stroke="#36B37E" stroke-width="3.2" marker-end="url(#arrow-green)"/>
    <text x="588" y="253" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1.1" fill="#5B6B7A">FROM STRUCTURE</text>
    <text x="588" y="274" text-anchor="middle" font-size="15" font-weight="700" fill="#36B37E">생성</text>

    <line x1="378" y1="404" x2="754" y2="331" stroke="#36B37E" stroke-width="3.2" marker-end="url(#arrow-green)"/>
    <text x="588" y="350" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1.1" fill="#5B6B7A">FROM FACTS</text>
    <text x="588" y="371" text-anchor="middle" font-size="15" font-weight="700" fill="#36B37E">인용</text>

    <line x1="378" y1="460" x2="754" y2="458" stroke="#36B37E" stroke-width="3.2" marker-end="url(#arrow-green)"/>
    <text x="588" y="437" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1.1" fill="#5B6B7A">FROM METADATA</text>
    <text x="588" y="459" text-anchor="middle" font-size="15" font-weight="700" fill="#36B37E">스캔</text>
  </g>

  <path d="M 914 502 C 914 580, 244 580, 244 470" fill="none" stroke="#2D6CDF" stroke-width="2.8" stroke-dasharray="6 7" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
  <text x="600" y="544" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1.2" fill="#5B6B7A">DERIVED ┄ CHECK ┄ SOT</text>
  <text x="600" y="565" text-anchor="middle" font-size="15" font-weight="700" fill="#2D6CDF">파생 == SoT? 기계가 점검</text>

  <path d="M 1070 292 C 1124 292, 1124 170, 1074 170" fill="none" stroke="#E5484D" stroke-width="2.8" stroke-dasharray="6 7" stroke-linecap="round" marker-end="url(#arrow-red)"/>
  <text x="1038" y="135" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1.1" fill="#5B6B7A">BLOCK DIRECT EDIT</text>
  <text x="1038" y="154" text-anchor="middle" font-size="14" font-weight="700" fill="#E5484D">사람이 파생을 직접 고치지 않음</text>

  <text x="600" y="622" text-anchor="middle" font-size="16" fill="#1B2733">사실을 <tspan font-weight="700" fill="#2D6CDF">한 곳</tspan>에 두고, 파생은 생성하거나 가리키게 — 고칠 땐 <tspan font-weight="700" fill="#2D6CDF">SoT를 먼저</tspan>, 어긋남은 <tspan font-weight="700" fill="#36B37E">기계가 점검</tspan></text>
</svg>