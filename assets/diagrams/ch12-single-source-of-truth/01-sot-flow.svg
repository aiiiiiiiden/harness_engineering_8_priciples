<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="Apple SD Gothic Neo, sans-serif">
  <defs>
    <marker id="ok" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6.5,3 L0,6 Z" fill="#36B37E"/>
    </marker>
    <marker id="loop" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6.5,3 L0,6 Z" fill="#2D6CDF"/>
    </marker>
    <marker id="esc" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6.5,3 L0,6 Z" fill="#5B6B7A"/>
    </marker>
    <marker id="block" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6.5,3 L0,6 Z" fill="#E5484D"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="660" fill="#F7F9FC"/>

  <text x="600" y="48" text-anchor="middle" font-size="27" font-weight="700" fill="#1B2733">진실의 원천(SoT) — 단방향 생성과 점검 루프</text>
  <text x="600" y="80" text-anchor="middle" font-size="16" fill="#5B6B7A">권위는 한 곳. 파생물은 거기서 생성되거나 거기를 가리킨다</text>

  <rect x="84" y="132" width="320" height="70" rx="14" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="244" y="161" text-anchor="middle" font-size="15" font-weight="700" fill="#1B2733">고칠 땐 SoT를 먼저</text>
  <text x="244" y="181" text-anchor="middle" font-size="13" fill="#5B6B7A">순서가 바뀌면 드리프트가 생긴다</text>
  <line x1="244" y1="202" x2="244" y2="244" stroke="#2D6CDF" stroke-width="5" marker-end="url(#loop)"/>

  <rect x="80" y="248" width="330" height="216" rx="16" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="3"/>
  <text x="245" y="286" text-anchor="middle" font-size="18" font-weight="700" fill="#1B2733">SoT</text>
  <text x="245" y="310" text-anchor="middle" font-size="14" fill="#5B6B7A">권위 있는 한 곳</text>

  <rect x="112" y="326" width="266" height="44" rx="14" fill="#F7F9FC" stroke="#2D6CDF" stroke-width="2"/>
  <text x="245" y="354" text-anchor="middle" font-size="15" font-weight="700" fill="#1B2733">structure.json</text>

  <rect x="112" y="382" width="266" height="44" rx="14" fill="#F7F9FC" stroke="#2D6CDF" stroke-width="2"/>
  <text x="245" y="410" text-anchor="middle" font-size="15" font-weight="700" fill="#1B2733">facts.md</text>

  <rect x="112" y="438" width="266" height="44" rx="14" fill="#F7F9FC" stroke="#2D6CDF" stroke-width="2"/>
  <text x="245" y="466" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1B2733">진행 상태 메타데이터</text>

  <rect x="760" y="170" width="310" height="78" rx="16" fill="#FFFFFF" stroke="#36B37E" stroke-width="3"/>
  <text x="915" y="204" text-anchor="middle" font-size="16" font-weight="700" fill="#1B2733">문서·페이지</text>
  <text x="915" y="226" text-anchor="middle" font-size="13" fill="#5B6B7A">구조 SoT에서 생성</text>

  <rect x="760" y="292" width="310" height="78" rx="16" fill="#FFFFFF" stroke="#36B37E" stroke-width="3"/>
  <text x="915" y="326" text-anchor="middle" font-size="16" font-weight="700" fill="#1B2733">본문</text>
  <text x="915" y="348" text-anchor="middle" font-size="13" fill="#5B6B7A">반복 사실 SoT를 인용</text>

  <rect x="760" y="414" width="310" height="88" rx="16" fill="#FFFFFF" stroke="#36B37E" stroke-width="3"/>
  <text x="915" y="448" text-anchor="middle" font-size="16" font-weight="700" fill="#1B2733">별도 매니페스트 없이 생성</text>
  <text x="915" y="470" text-anchor="middle" font-size="13" fill="#5B6B7A">각 항목 메타데이터를 스캔</text>

  <line x1="378" y1="348" x2="754" y2="209" stroke="#36B37E" stroke-width="6" marker-end="url(#ok)"/>
  <text x="588" y="254" text-anchor="middle" font-size="15" font-weight="700" fill="#36B37E">생성</text>

  <line x1="378" y1="404" x2="754" y2="331" stroke="#36B37E" stroke-width="6" marker-end="url(#ok)"/>
  <text x="588" y="356" text-anchor="middle" font-size="15" font-weight="700" fill="#36B37E">인용</text>

  <line x1="378" y1="460" x2="754" y2="458" stroke="#36B37E" stroke-width="6" marker-end="url(#ok)"/>
  <text x="588" y="446" text-anchor="middle" font-size="15" font-weight="700" fill="#36B37E">스캔</text>

  <path d="M 914 502 C 914 580, 244 580, 244 470" fill="none" stroke="#2D6CDF" stroke-width="5" stroke-dasharray="8 6" marker-end="url(#loop)"/>
  <text x="600" y="548" text-anchor="middle" font-size="15" font-weight="700" fill="#2D6CDF">파생 == SoT? 기계가 점검</text>

  <path d="M 1070 292 C 1124 292, 1124 170, 1074 170" fill="none" stroke="#E5484D" stroke-width="5" stroke-dasharray="7 6" marker-end="url(#block)"/>
  <text x="1038" y="145" text-anchor="middle" font-size="14" font-weight="700" fill="#E5484D">사람이 파생을 직접 고치지 않음</text>

  <text x="600" y="622" text-anchor="middle" font-size="16" fill="#1B2733">사실을 <tspan font-weight="700" fill="#2D6CDF">한 곳</tspan>에 두고, 파생은 생성하거나 가리키게 — 고칠 땐 <tspan font-weight="700" fill="#2D6CDF">SoT를 먼저</tspan>, 어긋남은 <tspan font-weight="700" fill="#36B37E">기계가 점검</tspan></text>
</svg>