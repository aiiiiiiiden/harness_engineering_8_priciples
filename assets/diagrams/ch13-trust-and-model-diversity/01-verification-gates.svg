<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="Apple SD Gothic Neo, sans-serif">
  <defs>
    <marker id="ok" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6.5,3 L0,6 Z" fill="#36B37E"/>
    </marker>
    <marker id="loop" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6.5,3 L0,6 Z" fill="#2D6CDF"/>
    </marker>
    <marker id="esc" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6.5,3 L0,6 Z" fill="#5B6B7A"/>
    </marker>
    <marker id="block" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6.5,3 L0,6 Z" fill="#E5484D"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="620" fill="#F7F9FC"/>

  <text x="600" y="48" text-anchor="middle" font-size="27" font-weight="700" fill="#1B2733">검증 게이트 — 모델 다양성</text>
  <text x="600" y="80" text-anchor="middle" font-size="16" fill="#5B6B7A">기계 → 의미 → 독립 모델. 셋이 합의해야 통과, 하나라도 실패하면 차단</text>

  <rect x="40" y="248" width="130" height="86" rx="16" fill="#FFFFFF" stroke="#5B6B7A" stroke-width="3"/>
  <text x="105" y="297" text-anchor="middle" font-size="17" font-weight="700" fill="#1B2733">산출물</text>

  <rect x="215" y="230" width="190" height="122" rx="16" fill="#FFFFFF" stroke="#36B37E" stroke-width="3"/>
  <text x="310" y="267" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1B2733">게이트1: 기계 검사</text>
  <text x="310" y="293" text-anchor="middle" font-size="13.5" fill="#5B6B7A">스키마·규칙·링크</text>
  <text x="310" y="318" text-anchor="middle" font-size="13.5" fill="#5B6B7A">(결정론적)</text>
  <text x="310" y="376" text-anchor="middle" font-size="13" font-weight="700" fill="#5B6B7A">원칙 5</text>

  <rect x="450" y="230" width="190" height="122" rx="16" fill="#FFFFFF" stroke="#36B37E" stroke-width="3"/>
  <text x="545" y="267" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1B2733">게이트2: 의미 검사</text>
  <text x="545" y="293" text-anchor="middle" font-size="13.5" fill="#5B6B7A">같은 모델 심층 검토</text>
  <text x="545" y="318" text-anchor="middle" font-size="13.5" fill="#5B6B7A">논리·설명</text>

  <rect x="685" y="218" width="220" height="146" rx="16" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="5"/>
  <text x="795" y="260" text-anchor="middle" font-size="16" font-weight="700" fill="#1B2733">게이트3: 독립 검사</text>
  <text x="795" y="288" text-anchor="middle" font-size="14" fill="#5B6B7A"><tspan font-weight="700" fill="#2D6CDF">다른 모델</tspan>이 사실</text>
  <text x="795" y="313" text-anchor="middle" font-size="14" fill="#5B6B7A">교차검증</text>
  <text x="795" y="388" text-anchor="middle" font-size="13" font-weight="700" fill="#2D6CDF">← 모델 다양성</text>

  <rect x="960" y="232" width="170" height="118" rx="16" fill="#FFFFFF" stroke="#36B37E" stroke-width="3"/>
  <text x="1045" y="278" text-anchor="middle" font-size="16" font-weight="700" fill="#36B37E">셋이 합의해야</text>
  <text x="1045" y="305" text-anchor="middle" font-size="16" font-weight="700" fill="#36B37E">통과</text>
  <text x="1045" y="374" text-anchor="middle" font-size="13" font-weight="700" fill="#5B6B7A">원칙 7의 루프</text>

  <line x1="170" y1="291" x2="211" y2="291" stroke="#36B37E" stroke-width="6" marker-end="url(#ok)"/>
  <line x1="405" y1="291" x2="446" y2="291" stroke="#36B37E" stroke-width="6" marker-end="url(#ok)"/>
  <line x1="640" y1="291" x2="681" y2="291" stroke="#36B37E" stroke-width="6" marker-end="url(#ok)"/>
  <line x1="905" y1="291" x2="956" y2="291" stroke="#36B37E" stroke-width="6" marker-end="url(#ok)"/>

  <path d="M 310 352 C 310 430, 600 430, 600 462" fill="none" stroke="#E5484D" stroke-width="5" stroke-dasharray="8 6" marker-end="url(#block)"/>
  <path d="M 545 352 C 545 410, 600 420, 600 462" fill="none" stroke="#E5484D" stroke-width="5" stroke-dasharray="8 6" marker-end="url(#block)"/>
  <path d="M 795 364 C 795 430, 600 430, 600 462" fill="none" stroke="#E5484D" stroke-width="5" stroke-dasharray="8 6" marker-end="url(#block)"/>

  <rect x="455" y="462" width="290" height="66" rx="14" fill="#FFFFFF" stroke="#E5484D" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="600" y="502" text-anchor="middle" font-size="16" font-weight="700" fill="#E5484D">하나라도 실패 = 차단</text>

  <text x="600" y="582" text-anchor="middle" font-size="16" fill="#1B2733">신뢰성의 핵심은 <tspan font-weight="700" fill="#2D6CDF">모델 다양성</tspan> — 집필 모델이 놓친 사실 오류를 <tspan font-weight="700" fill="#2D6CDF">독립 모델(codex)</tspan>이 잡는다</text>
</svg>