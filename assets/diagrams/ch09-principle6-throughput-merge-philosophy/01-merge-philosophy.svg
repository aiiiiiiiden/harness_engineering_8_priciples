<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Apple SD Gothic Neo, sans-serif">
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6.2" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6.2,3 L0,6 Z" fill="#2D6CDF"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6.2" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6.2,3 L0,6 Z" fill="#36B37E"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="6.2" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6.2,3 L0,6 Z" fill="#E5484D"/>
    </marker>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="6.2" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6.2,3 L0,6 Z" fill="#5B6B7A"/>
    </marker>
    <pattern id="dot-field" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.2" fill="#2D6CDF" opacity="0.12"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1200" height="760" fill="#F7F9FC"/>
  <rect x="42" y="104" width="1116" height="536" fill="url(#dot-field)" opacity="0.7"/>

  <text x="600" y="50" text-anchor="middle" font-size="27" font-weight="700" fill="#1B2733">병합 철학 — 처리량이 비용을 뒤집는다</text>
  <text x="600" y="82" text-anchor="middle" font-size="16" fill="#5B6B7A">사람 시대: 수정 비싸고 대기 쌈 → 에이전트 시대: 수정 싸고 대기 비쌈</text>

  <text x="58" y="140" font-size="11" font-weight="700" letter-spacing="1.4" fill="#E5484D">HUMAN-SPEED</text>
  <text x="58" y="163" font-size="17" font-weight="700" fill="#1B2733">사람 속도 기본값</text>
  <text x="58" y="184" font-size="13" fill="#5B6B7A">대기=병목 · 모든 PR이</text>
  <text x="58" y="204" font-size="13" fill="#5B6B7A">게이트 앞에 선다</text>

  <rect x="248" y="128" width="150" height="58" rx="14" fill="#FFFFFF" stroke="#E5484D" stroke-width="2"/>
  <text x="323" y="152" text-anchor="middle" font-size="14" font-weight="700" fill="#1B2733">PR 17</text>
  <text x="323" y="172" text-anchor="middle" font-size="12" fill="#5B6B7A">대기 중</text>

  <rect x="264" y="150" width="150" height="58" rx="14" fill="#FFFFFF" stroke="#E5484D" stroke-width="2" opacity="0.94"/>
  <text x="339" y="174" text-anchor="middle" font-size="14" font-weight="700" fill="#1B2733">PR 18</text>
  <text x="339" y="194" text-anchor="middle" font-size="12" fill="#5B6B7A">대기 중</text>

  <rect x="280" y="172" width="150" height="58" rx="14" fill="#FFFFFF" stroke="#E5484D" stroke-width="2" opacity="0.9"/>
  <text x="355" y="196" text-anchor="middle" font-size="14" font-weight="700" fill="#1B2733">PR 19</text>
  <text x="355" y="216" text-anchor="middle" font-size="12" fill="#5B6B7A">대기 중</text>

  <line x1="440" y1="201" x2="500" y2="201" stroke="#E5484D" stroke-width="3" marker-end="url(#arrow-red)"/>
  <text x="470" y="184" text-anchor="middle" font-size="9.5" font-weight="700" letter-spacing="1.1" fill="#E5484D">QUEUE</text>

  <rect x="512" y="132" width="220" height="138" rx="16" fill="#FFFFFF" stroke="#E5484D" stroke-width="2.5"/>
  <text x="622" y="162" text-anchor="middle" font-size="16" font-weight="700" fill="#1B2733">모든 PR 사람 승인 필수</text>
  <line x1="544" y1="179" x2="700" y2="179" stroke="#F1C9CB" stroke-width="1"/>
  <text x="622" y="204" text-anchor="middle" font-size="13" fill="#5B6B7A">긴 PR 수명</text>
  <text x="622" y="228" text-anchor="middle" font-size="13" fill="#5B6B7A">단발 플래키</text>
  <text x="622" y="248" text-anchor="middle" font-size="13" fill="#E5484D" font-weight="700">무기한 차단</text>

  <line x1="732" y1="201" x2="786" y2="201" stroke="#E5484D" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrow-red)"/>
  <text x="759" y="184" text-anchor="middle" font-size="9.5" font-weight="700" letter-spacing="1.1" fill="#E5484D">WAIT</text>

  <rect x="800" y="146" width="190" height="110" rx="16" fill="#FFFFFF" stroke="#E5484D" stroke-width="2"/>
  <text x="895" y="181" text-anchor="middle" font-size="15" font-weight="700" fill="#1B2733">게이트 앞 정체</text>
  <text x="895" y="207" text-anchor="middle" font-size="12.5" fill="#5B6B7A">수정은 비싸고</text>
  <text x="895" y="229" text-anchor="middle" font-size="12.5" fill="#E5484D" font-weight="700">대기는 싸다는 가정</text>

  <path d="M 990 201 C 1030 201, 1034 248, 1070 248" fill="none" stroke="#E5484D" stroke-width="2.8" stroke-dasharray="6 6" marker-end="url(#arrow-red)"/>
  <rect x="1070" y="218" width="76" height="60" rx="14" fill="#FFFFFF" stroke="#E5484D" stroke-width="2"/>
  <text x="1108" y="243" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1B2733">병합</text>
  <text x="1108" y="263" text-anchor="middle" font-size="11.5" fill="#E5484D">느림</text>

  <line x1="112" y1="326" x2="1088" y2="326" stroke="#D8E2F0" stroke-width="1"/>

  <text x="58" y="386" font-size="11" font-weight="700" letter-spacing="1.4" fill="#2D6CDF">THROUGHPUT</text>
  <text x="58" y="409" font-size="17" font-weight="700" fill="#1B2733">처리량 정책 — 원칙6</text>
  <text x="58" y="430" font-size="13" fill="#5B6B7A">짧게 만들고, 빨리 검증하고,</text>
  <text x="58" y="450" font-size="13" fill="#5B6B7A">판단만 사람에게 보낸다</text>

  <rect x="244" y="442" width="178" height="88" rx="16" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="2"/>
  <text x="333" y="476" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1B2733">짧은 PR</text>
  <text x="333" y="501" text-anchor="middle" font-size="12.5" fill="#5B6B7A">작은 변경 단위</text>

  <line x1="422" y1="486" x2="466" y2="486" stroke="#36B37E" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="444" y="467" text-anchor="middle" font-size="9.5" font-weight="700" letter-spacing="1.1" fill="#36B37E">FLOW</text>

  <rect x="472" y="442" width="190" height="88" rx="16" fill="#FFFFFF" stroke="#36B37E" stroke-width="2.5"/>
  <text x="567" y="476" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1B2733">빠른 병합</text>
  <text x="567" y="501" text-anchor="middle" font-size="12.5" fill="#5B6B7A">대기를 비용으로 본다</text>

  <line x1="662" y1="486" x2="706" y2="486" stroke="#36B37E" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="684" y="467" text-anchor="middle" font-size="9.5" font-weight="700" letter-spacing="1.1" fill="#36B37E">PASS</text>

  <rect x="712" y="442" width="212" height="88" rx="16" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="2"/>
  <text x="818" y="475" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1B2733">사람 승인은</text>
  <text x="818" y="499" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1B2733">판단 필요할 때만</text>

  <line x1="924" y1="486" x2="968" y2="486" stroke="#36B37E" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="946" y="467" text-anchor="middle" font-size="9.5" font-weight="700" letter-spacing="1.1" fill="#36B37E">MERGE</text>

  <rect x="976" y="420" width="186" height="136" rx="16" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="2"/>
  <text x="1069" y="454" text-anchor="middle" font-size="15" font-weight="700" fill="#1B2733">최소 차단 게이트</text>
  <text x="1069" y="480" text-anchor="middle" font-size="12.5" fill="#5B6B7A">어겨선 안 될</text>
  <text x="1069" y="501" text-anchor="middle" font-size="12.5" fill="#5B6B7A">불변식만 차단</text>
  <text x="1069" y="528" text-anchor="middle" font-size="12" font-weight="700" fill="#E5484D">BLOCK ONLY INVARIANTS</text>

  <path d="M 818 442 C 818 388, 1028 386, 1069 414" fill="none" stroke="#5B6B7A" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#arrow-gray)"/>
  <text x="946" y="374" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1.2" fill="#5B6B7A">FROM JUDGMENT ┄▶ TO HUMAN REVIEW</text>

  <path d="M 1069 556 C 1069 600, 650 602, 567 535" fill="none" stroke="#36B37E" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="812" y="620" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1.3" fill="#36B37E">FROM MINIMAL GATE ┄▶ TO FAST MERGE</text>

  <line x1="112" y1="646" x2="1088" y2="646" stroke="#D8E2F0" stroke-width="1"/>
  <text x="600" y="695" text-anchor="middle" font-size="16" fill="#1B2733">차단은 <tspan font-weight="700" fill="#2D6CDF">정확성에 필요한 곳에만</tspan> — 사람 주의를 전제한 차단은 <tspan font-weight="700" fill="#E5484D">처리량 앞에서 병목</tspan>이 된다</text>
</svg>