<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="Apple SD Gothic Neo, sans-serif">
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6.2" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6.2,3 L0,6 Z" fill="#2D6CDF"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6.2" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6.2,3 L0,6 Z" fill="#36B37E"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="6.2" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6.2,3 L0,6 Z" fill="#E5484D"/>
    </marker>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="6.2" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6.2,3 L0,6 Z" fill="#5B6B7A"/>
    </marker>
    <pattern id="dot-field" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.2" fill="#2D6CDF" opacity="0.12"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1200" height="660" fill="#F7F9FC"/>
  <rect x="42" y="108" width="1116" height="438" fill="url(#dot-field)" opacity="0.7"/>

  <text x="600" y="50" text-anchor="middle" font-size="27" font-weight="700" fill="#1B2733">조종과 실행 — 역할 분담</text>
  <text x="600" y="82" text-anchor="middle" font-size="16" fill="#5B6B7A">사람은 무엇을·왜, 에이전트는 어떻게(코드). 관제사는 운전하지 않는다</text>

  <rect x="70" y="136" width="430" height="330" rx="16" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="2"/>
  <text x="96" y="168" font-size="11" font-weight="700" letter-spacing="1.4" fill="#2D6CDF">STEER</text>
  <text x="285" y="171" text-anchor="middle" font-size="20" font-weight="700" fill="#1B2733">사람 = 조종</text>
  <text x="285" y="197" text-anchor="middle" font-size="13" fill="#5B6B7A">목표·의도·판정 기준을 정한다</text>

  <rect x="110" y="224" width="350" height="54" rx="14" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="2"/>
  <text x="285" y="257" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1B2733">우선순위 정하기</text>

  <rect x="110" y="300" width="350" height="54" rx="14" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="2"/>
  <text x="285" y="333" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1B2733">의도를 수용 기준으로 번역</text>

  <rect x="110" y="376" width="350" height="54" rx="14" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="2"/>
  <text x="285" y="409" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1B2733">결과 검증</text>

  <rect x="700" y="136" width="430" height="330" rx="16" fill="#FFFFFF" stroke="#36B37E" stroke-width="2.5"/>
  <text x="726" y="168" font-size="11" font-weight="700" letter-spacing="1.4" fill="#36B37E">EXECUTE</text>
  <text x="915" y="171" text-anchor="middle" font-size="20" font-weight="700" fill="#1B2733">에이전트 = 실행</text>
  <text x="915" y="197" text-anchor="middle" font-size="13" fill="#5B6B7A">수용 기준을 코드와 검증 가능한 결과로 바꾼다</text>

  <rect x="805" y="264" width="230" height="106" rx="16" fill="#FFFFFF" stroke="#36B37E" stroke-width="2.5"/>
  <text x="920" y="309" text-anchor="middle" font-size="18" font-weight="700" fill="#1B2733">코드 작성·구현</text>
  <text x="920" y="335" text-anchor="middle" font-size="13" fill="#5B6B7A">설계 → 수정 → 테스트</text>

  <path d="M 500 262 C 575 232, 625 232, 700 262" fill="none" stroke="#2D6CDF" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="600" y="221" text-anchor="middle" font-size="15" font-weight="700" fill="#2D6CDF">수용 기준 전달</text>
  <text x="600" y="242" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1.3" fill="#5B6B7A">FROM STEER ┄▶ TO EXECUTE</text>

  <path d="M 700 390 C 625 432, 575 432, 500 390" fill="none" stroke="#36B37E" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="600" y="453" text-anchor="middle" font-size="15" font-weight="700" fill="#36B37E">검증 결과 반환</text>
  <text x="600" y="476" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1.3" fill="#5B6B7A">FROM RESULT ┄▶ TO HUMAN REVIEW</text>

  <rect x="392" y="492" width="416" height="58" rx="15" fill="#FFFFFF" stroke="#E5484D" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="600" y="516" text-anchor="middle" font-size="15" font-weight="700" fill="#1B2733">안티패턴: 사람이 실행으로 내려감</text>
  <text x="600" y="537" text-anchor="middle" font-size="13" fill="#E5484D">직접 타이핑 → 병목</text>

  <path d="M 285 466 C 335 505, 358 521, 386 521" fill="none" stroke="#E5484D" stroke-width="3" stroke-dasharray="6 6" marker-end="url(#arrow-red)"/>
  <text x="305" y="495" font-size="10" font-weight="700" letter-spacing="1.2" fill="#E5484D">BOTTLENECK</text>
  <line x1="808" y1="521" x2="870" y2="521" stroke="#5B6B7A" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#arrow-gray)"/>
  <text x="880" y="525" font-size="10" font-weight="700" letter-spacing="1.2" fill="#5B6B7A">TO KEYBOARD</text>

  <line x1="112" y1="578" x2="1088" y2="578" stroke="#D8E2F0" stroke-width="1"/>
  <text x="600" y="618" text-anchor="middle" font-size="16" fill="#1B2733">조종의 가치는 <tspan font-weight="700" fill="#2D6CDF">운전을 안 하는 데</tspan> 있다 — 사람이 실행에 끼는 만큼이 <tspan font-weight="700" fill="#E5484D">처리량의 천장</tspan></text>
</svg>