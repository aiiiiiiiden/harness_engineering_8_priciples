<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="Apple SD Gothic Neo, sans-serif">
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6.2" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6.2,3 L0,6 Z" fill="#2D6CDF"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6.2" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6.2,3 L0,6 Z" fill="#36B37E"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="6.2" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6.2,3 L0,6 Z" fill="#E5484D"/>
    </marker>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="6.2" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6.2,3 L0,6 Z" fill="#5B6B7A"/>
    </marker>
    <pattern id="dot-field" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.2" fill="#2D6CDF" opacity="0.12"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1200" height="660" fill="#F7F9FC"/>
  <rect x="42" y="108" width="1116" height="438" fill="url(#dot-field)" opacity="0.72"/>

  <text x="600" y="50" text-anchor="middle" font-size="27" font-weight="700" fill="#1B2733">원칙 2 — 에이전트의 눈: 자가 검증 루프</text>
  <text x="600" y="82" text-anchor="middle" font-size="16" fill="#5B6B7A">검증할 수 없으면 고친 게 아니다 · 사람 QA 병목을 에이전트의 눈으로</text>

  <text x="74" y="150" font-size="11" font-weight="700" letter-spacing="1.4" fill="#2D6CDF">BOOT ┄ OBSERVE ┄ VERIFY</text>
  <line x1="74" y1="162" x2="255" y2="162" stroke="#2D6CDF" stroke-width="2.3" stroke-dasharray="5 6" marker-end="url(#arrow-blue)"/>

  <rect x="70" y="246" width="190" height="118" rx="16" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="2"/>
  <text x="165" y="288" text-anchor="middle" font-size="17" font-weight="700" fill="#1B2733">에이전트</text>
  <text x="165" y="314" text-anchor="middle" font-size="13" fill="#5B6B7A">고치고 · 실행하고</text>
  <text x="165" y="335" text-anchor="middle" font-size="13" fill="#5B6B7A">다시 읽는 주체</text>

  <rect x="330" y="146" width="230" height="92" rx="16" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="2"/>
  <text x="445" y="181" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1B2733">① boot.sh</text>
  <text x="445" y="205" text-anchor="middle" font-size="13" fill="#5B6B7A">격리 인스턴스 부팅</text>
  <text x="445" y="224" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1.1" fill="#2D6CDF">BOOT</text>

  <rect x="650" y="146" width="250" height="92" rx="16" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="2"/>
  <text x="775" y="181" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1B2733">② 통합 테스트</text>
  <text x="775" y="205" text-anchor="middle" font-size="13" fill="#5B6B7A">수용 기준 때려보기</text>
  <text x="775" y="224" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1.1" fill="#2D6CDF">VERIFY</text>

  <rect x="720" y="352" width="290" height="116" rx="16" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="2"/>
  <text x="865" y="389" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1B2733">③ 관측성 읽기</text>
  <text x="865" y="414" text-anchor="middle" font-size="12.5" fill="#5B6B7A">로그 LogQL · 메트릭 PromQL</text>
  <text x="865" y="435" text-anchor="middle" font-size="12.5" fill="#5B6B7A">스크린샷 CDP</text>
  <text x="865" y="454" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1.1" fill="#2D6CDF">OBSERVE</text>

  <rect x="384" y="352" width="190" height="116" rx="16" fill="#FFFFFF" stroke="#36B37E" stroke-width="2.5"/>
  <text x="479" y="396" text-anchor="middle" font-size="17" font-weight="700" fill="#1B2733">통과?</text>
  <text x="479" y="424" text-anchor="middle" font-size="13" fill="#5B6B7A">증거로 판단</text>
  <text x="479" y="444" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1.1" fill="#36B37E">PASS GATE</text>

  <rect x="74" y="436" width="230" height="84" rx="16" fill="#FFFFFF" stroke="#E5484D" stroke-width="2"/>
  <text x="189" y="471" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1B2733">로그 읽고 → 고치고</text>
  <text x="189" y="496" text-anchor="middle" font-size="13" fill="#5B6B7A">실패 원인으로 수정</text>

  <rect x="982" y="176" width="122" height="104" rx="16" fill="#FFFFFF" stroke="#36B37E" stroke-width="2.5"/>
  <text x="1043" y="220" text-anchor="middle" font-size="17" font-weight="700" fill="#1B2733">완료</text>
  <text x="1043" y="246" text-anchor="middle" font-size="13" fill="#5B6B7A">검증된 변경</text>

  <rect x="360" y="520" width="430" height="72" rx="15" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="575" y="548" text-anchor="middle" font-size="15" font-weight="700" fill="#1B2733">앱 내부가 에이전트에게 노출된다</text>
  <text x="575" y="570" text-anchor="middle" font-size="12.5" fill="#5B6B7A">로그 · 메트릭 · 화면이 추측을 증거로 바꾼다</text>

  <line x1="260" y1="305" x2="326" y2="192" stroke="#2D6CDF" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <line x1="560" y1="192" x2="644" y2="192" stroke="#2D6CDF" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M 775 238 C 775 285, 865 290, 865 346" fill="none" stroke="#2D6CDF" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <line x1="720" y1="410" x2="580" y2="410" stroke="#2D6CDF" stroke-width="3" marker-end="url(#arrow-blue)"/>

  <path d="M 479 352 C 480 292, 445 288, 445 244" fill="none" stroke="#E5484D" stroke-width="3" marker-end="url(#arrow-red)"/>
  <text x="510" y="306" font-size="10" font-weight="700" letter-spacing="1.1" fill="#E5484D">NO: 다시 ①로</text>

  <line x1="384" y1="410" x2="310" y2="478" stroke="#E5484D" stroke-width="3" marker-end="url(#arrow-red)"/>
  <path d="M 189 436 C 188 394, 165 390, 165 370" fill="none" stroke="#E5484D" stroke-width="3" marker-end="url(#arrow-red)"/>
  <text x="294" y="458" font-size="10" font-weight="700" letter-spacing="1.1" fill="#E5484D">FIX</text>

  <path d="M 574 410 C 630 492, 875 504, 865 474" fill="none" stroke="#2D6CDF" stroke-width="2.7" stroke-dasharray="6 6" marker-end="url(#arrow-blue)"/>
  <path d="M 790 542 C 875 520, 920 488, 902 470" fill="none" stroke="#2D6CDF" stroke-width="2.7" stroke-dasharray="6 6" marker-end="url(#arrow-blue)"/>
  <text x="808" y="533" font-size="10" font-weight="700" letter-spacing="1.1" fill="#5B6B7A">APP INTERNALS ┄▶ AGENT EYES</text>

  <line x1="479" y1="352" x2="479" y2="318" stroke="#36B37E" stroke-width="3" marker-end="url(#arrow-green)"/>
  <path d="M 479 318 C 585 250, 785 260, 976 222" fill="none" stroke="#36B37E" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="610" y="275" font-size="10" font-weight="700" letter-spacing="1.1" fill="#36B37E">YES: 검증 완료</text>

  <line x1="112" y1="610" x2="1088" y2="610" stroke="#D8E2F0" stroke-width="1"/>
  <text x="600" y="638" text-anchor="middle" font-size="16" fill="#1B2733">눈이 있어야 <tspan font-weight="700" fill="#E5484D">추측</tspan>이 <tspan font-weight="700" fill="#2D6CDF">검증</tspan>이 된다 — <tspan font-weight="700" fill="#36B37E">부팅·측정·수정</tspan>이 에이전트 안에서 닫힌다</text>
</svg>