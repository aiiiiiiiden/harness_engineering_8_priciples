<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Apple SD Gothic Neo, sans-serif">
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6.2" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6.2,3 L0,6 Z" fill="#2D6CDF"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6.2" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6.2,3 L0,6 Z" fill="#36B37E"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="6.2" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6.2,3 L0,6 Z" fill="#E5484D"/>
    </marker>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="6.2" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6.2,3 L0,6 Z" fill="#5B6B7A"/>
    </marker>
    <pattern id="dot-field" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.2" fill="#2D6CDF" opacity="0.12"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1200" height="760" fill="#F7F9FC"/>
  <rect x="42" y="108" width="1116" height="592" fill="url(#dot-field)" opacity="0.72"/>

  <text x="600" y="50" text-anchor="middle" font-size="27" font-weight="700" fill="#1B2733">원칙 2 — 에이전트의 눈: 자가 검증 루프</text>
  <text x="600" y="82" text-anchor="middle" font-size="16" fill="#5B6B7A">검증할 수 없으면 고친 게 아니다 · 사람 QA 병목을 에이전트의 눈으로</text>

  <text x="74" y="150" font-size="11" font-weight="700" letter-spacing="1.4" fill="#2D6CDF">BOOT ┄ OBSERVE ┄ VERIFY</text>
  <line x1="74" y1="162" x2="255" y2="162" stroke="#2D6CDF" stroke-width="2.3" stroke-dasharray="5 6" marker-end="url(#arrow-blue)"/>

  <rect x="70" y="260" width="190" height="118" rx="16" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="2"/>
  <text x="165" y="302" text-anchor="middle" font-size="17" font-weight="700" fill="#1B2733">에이전트</text>
  <text x="165" y="328" text-anchor="middle" font-size="13" fill="#5B6B7A">고치고 · 실행하고</text>
  <text x="165" y="349" text-anchor="middle" font-size="13" fill="#5B6B7A">다시 읽는 주체</text>

  <rect x="330" y="150" width="230" height="92" rx="16" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="2"/>
  <text x="445" y="185" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1B2733">① boot.sh</text>
  <text x="445" y="209" text-anchor="middle" font-size="13" fill="#5B6B7A">격리 인스턴스 부팅</text>
  <text x="445" y="228" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1.1" fill="#2D6CDF">BOOT</text>

  <rect x="650" y="150" width="250" height="92" rx="16" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="2"/>
  <text x="775" y="185" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1B2733">② 통합 테스트</text>
  <text x="775" y="209" text-anchor="middle" font-size="13" fill="#5B6B7A">수용 기준 때려보기</text>
  <text x="775" y="228" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1.1" fill="#2D6CDF">VERIFY</text>

  <rect x="720" y="380" width="290" height="116" rx="16" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="2"/>
  <text x="865" y="417" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1B2733">③ 관측성 읽기</text>
  <text x="865" y="442" text-anchor="middle" font-size="12.5" fill="#5B6B7A">로그 LogQL · 메트릭 PromQL</text>
  <text x="865" y="463" text-anchor="middle" font-size="12.5" fill="#5B6B7A">스크린샷 CDP</text>
  <text x="865" y="482" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1.1" fill="#2D6CDF">OBSERVE</text>

  <rect x="384" y="380" width="190" height="116" rx="16" fill="#FFFFFF" stroke="#36B37E" stroke-width="2.5"/>
  <text x="479" y="424" text-anchor="middle" font-size="17" font-weight="700" fill="#1B2733">통과?</text>
  <text x="479" y="452" text-anchor="middle" font-size="13" fill="#5B6B7A">증거로 판단</text>
  <text x="479" y="472" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1.1" fill="#36B37E">PASS GATE</text>

  <rect x="74" y="500" width="230" height="84" rx="16" fill="#FFFFFF" stroke="#E5484D" stroke-width="2"/>
  <text x="189" y="535" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1B2733">로그 읽고 → 고치고</text>
  <text x="189" y="560" text-anchor="middle" font-size="13" fill="#5B6B7A">실패 원인으로 수정</text>

  <rect x="970" y="170" width="150" height="104" rx="16" fill="#FFFFFF" stroke="#36B37E" stroke-width="2.5"/>
  <text x="1045" y="214" text-anchor="middle" font-size="17" font-weight="700" fill="#1B2733">완료</text>
  <text x="1045" y="240" text-anchor="middle" font-size="13" fill="#5B6B7A">검증된 변경</text>

  <rect x="360" y="610" width="430" height="72" rx="15" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="575" y="638" text-anchor="middle" font-size="15" font-weight="700" fill="#1B2733">앱 내부가 에이전트에게 노출된다</text>
  <text x="575" y="660" text-anchor="middle" font-size="12.5" fill="#5B6B7A">로그 · 메트릭 · 화면이 추측을 증거로 바꾼다</text>

  <line x1="260" y1="319" x2="326" y2="196" stroke="#2D6CDF" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <line x1="560" y1="196" x2="644" y2="196" stroke="#2D6CDF" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M 775 242 C 775 310, 865 318, 865 374" fill="none" stroke="#2D6CDF" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <line x1="720" y1="438" x2="580" y2="438" stroke="#2D6CDF" stroke-width="3" marker-end="url(#arrow-blue)"/>

  <path d="M 479 380 C 480 318, 445 308, 445 248" fill="none" stroke="#E5484D" stroke-width="3" marker-end="url(#arrow-red)"/>
  <text x="506" y="320" font-size="10" font-weight="700" letter-spacing="1.1" fill="#E5484D">NO: 다시 ①로</text>

  <line x1="384" y1="438" x2="307" y2="515" stroke="#E5484D" stroke-width="3" marker-end="url(#arrow-red)"/>
  <path d="M 189 500 C 188 445, 165 424, 165 384" fill="none" stroke="#E5484D" stroke-width="3" marker-end="url(#arrow-red)"/>
  <text x="324" y="492" font-size="10" font-weight="700" letter-spacing="1.1" fill="#E5484D">FIX</text>

  <path d="M 574 455 C 650 560, 880 568, 865 502" fill="none" stroke="#2D6CDF" stroke-width="2.7" stroke-dasharray="6 6" marker-end="url(#arrow-blue)"/>
  <path d="M 790 646 C 875 620, 930 552, 902 502" fill="none" stroke="#2D6CDF" stroke-width="2.7" stroke-dasharray="6 6" marker-end="url(#arrow-blue)"/>
  <text x="808" y="600" font-size="10" font-weight="700" letter-spacing="1.1" fill="#5B6B7A">APP INTERNALS ┄▶ AGENT EYES</text>

  <path d="M 574 430 C 660 328, 846 322, 964 226" fill="none" stroke="#36B37E" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="624" y="325" font-size="10" font-weight="700" letter-spacing="1.1" fill="#36B37E">YES: 검증 완료</text>

  <line x1="112" y1="710" x2="1088" y2="710" stroke="#D8E2F0" stroke-width="1"/>
  <text x="600" y="738" text-anchor="middle" font-size="16" fill="#1B2733">눈이 있어야 <tspan font-weight="700" fill="#E5484D">추측</tspan>이 <tspan font-weight="700" fill="#2D6CDF">검증</tspan>이 된다 — <tspan font-weight="700" fill="#36B37E">부팅·측정·수정</tspan>이 에이전트 안에서 닫힌다</text>
</svg>