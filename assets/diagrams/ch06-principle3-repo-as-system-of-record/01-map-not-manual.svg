<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="Apple SD Gothic Neo, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5B6B7A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="620" fill="#F7F9FC"/>

  <!-- 제목 -->
  <text x="600" y="50" text-anchor="middle" font-size="29" font-weight="700" fill="#1B2733">원칙 3 — 매뉴얼이 아니라 맵 + 기록 시스템</text>
  <text x="600" y="84" text-anchor="middle" font-size="17" fill="#5B6B7A">지식은 리포지터리에, 진입점은 백과사전이 아니라 목차로</text>

  <!-- 이음매 -->
  <line x1="600" y1="120" x2="600" y2="560" stroke="#1B2733" stroke-width="2.5" stroke-dasharray="3 9"/>

  <!-- ===== 왼쪽: 거대 매뉴얼 (안티패턴) ===== -->
  <text x="300" y="138" text-anchor="middle" font-size="18" font-weight="700" fill="#E5484D">안티패턴 — 거대 단일 매뉴얼</text>
  <rect x="95" y="158" width="410" height="372" rx="16" fill="#FFFFFF" stroke="#E5484D" stroke-width="3"/>
  <rect x="95" y="158" width="410" height="44" rx="16" fill="#E5484D"/>
  <rect x="95" y="186" width="410" height="16" fill="#E5484D"/>
  <text x="300" y="187" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">AGENTS.md (1,000줄)</text>

  <text x="120" y="236" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#1B2733">DB는 Postgres, 마이그레이션은…</text>
  <text x="120" y="266" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#1B2733">인증은 authlib, 토큰은…</text>
  <text x="120" y="296" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#5B6B7A">에러 포맷은… (낡음)</text>
  <line x1="120" y1="291" x2="360" y2="291" stroke="#E5484D" stroke-width="2"/>
  <text x="120" y="326" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#5B6B7A">로깅 규칙은… (낡음)</text>
  <line x1="120" y1="321" x2="345" y2="321" stroke="#E5484D" stroke-width="2"/>
  <text x="120" y="356" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#1B2733">레이트리밋은…</text>
  <text x="120" y="386" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#5B6B7A">배포 절차는… (낡음)</text>
  <line x1="120" y1="381" x2="350" y2="381" stroke="#E5484D" stroke-width="2"/>
  <text x="120" y="416" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#1B2733">… 그리고 940줄 더</text>

  <text x="300" y="470" text-anchor="middle" font-size="14" font-weight="700" fill="#E5484D">낡은 규칙의 무덤 · 컨텍스트 잠식</text>
  <text x="300" y="494" text-anchor="middle" font-size="14" font-weight="700" fill="#E5484D">기계 점검 불가 → 드리프트</text>

  <!-- ===== 오른쪽: 맵 + 기록 시스템 ===== -->
  <text x="900" y="138" text-anchor="middle" font-size="18" font-weight="700" fill="#36B37E">맵 + 기록 시스템</text>

  <!-- 맵 -->
  <rect x="745" y="158" width="310" height="78" rx="16" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="3"/>
  <text x="900" y="190" text-anchor="middle" font-size="16" font-weight="700" fill="#1B2733">AGENTS.md — 맵 (약 100줄)</text>
  <text x="900" y="216" text-anchor="middle" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#5B6B7A">담지 않고 '가리킨다'</text>

  <!-- 점진적 공개 화살표 -->
  <line x1="900" y1="236" x2="900" y2="286" stroke="#5B6B7A" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="915" y="268" font-size="13" fill="#5B6B7A">점진적 공개 — 필요한 깊이만</text>

  <!-- docs 기록 시스템 컨테이너 -->
  <rect x="660" y="296" width="480" height="234" rx="18" fill="#E7F6EF"/>
  <text x="900" y="324" text-anchor="middle" font-size="15" font-weight="700" fill="#1B2733">docs/ — 기록 시스템 (버전 관리)</text>

  <rect x="685" y="342" width="430" height="52" rx="12" fill="#FFFFFF" stroke="#36B37E" stroke-width="2.5"/>
  <text x="705" y="365" font-size="13.5" font-family="ui-monospace, Menlo, monospace" font-weight="700" fill="#1B2733">design-docs/</text>
  <text x="705" y="384" font-size="12" fill="#5B6B7A">결정·핵심 신념 (왜 Postgres인가)</text>

  <rect x="685" y="404" width="430" height="52" rx="12" fill="#FFFFFF" stroke="#36B37E" stroke-width="2.5"/>
  <text x="705" y="427" font-size="13.5" font-family="ui-monospace, Menlo, monospace" font-weight="700" fill="#1B2733">exec-plans/</text>
  <text x="705" y="446" font-size="12" fill="#5B6B7A">계획 + 의사결정 로그 (일급 아티팩트)</text>

  <rect x="685" y="466" width="430" height="52" rx="12" fill="#FFFFFF" stroke="#36B37E" stroke-width="2.5"/>
  <text x="705" y="489" font-size="13.5" font-family="ui-monospace, Menlo, monospace" font-weight="700" fill="#1B2733">references/</text>
  <text x="705" y="508" font-size="12" fill="#5B6B7A">외부 라이브러리 요약 (*-llms.txt)</text>

  <!-- 하단 핵심 -->
  <text x="600" y="588" text-anchor="middle" font-size="16" fill="#1B2733">린터·CI가 <tspan font-weight="700" fill="#36B37E">신선도·교차 링크</tspan>를 기계 점검한다(doc-gardening) — 단일 덩어리로는 불가능</text>
</svg>
