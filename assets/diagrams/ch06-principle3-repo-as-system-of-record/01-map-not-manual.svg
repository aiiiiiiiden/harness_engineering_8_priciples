<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="Apple SD Gothic Neo, sans-serif">
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6.5,3 L0,6 Z" fill="#2D6CDF"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6.5,3 L0,6 Z" fill="#36B37E"/>
    </marker>
    <pattern id="dot-field" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="1.2" fill="#2D6CDF" opacity="0.16"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1200" height="620" fill="#F7F9FC"/>
  <rect x="42" y="118" width="236" height="176" fill="url(#dot-field)" opacity="0.75"/>
  <rect x="928" y="140" width="198" height="158" fill="url(#dot-field)" opacity="0.7"/>

  <text x="600" y="50" text-anchor="middle" font-size="27" font-weight="700" fill="#1B2733">원칙 3 — 매뉴얼이 아니라 맵 + 기록 시스템</text>
  <text x="600" y="84" text-anchor="middle" font-size="16" fill="#5B6B7A">지식은 리포지터리에, 진입점은 백과사전이 아니라 목차로</text>

  <line x1="600" y1="122" x2="600" y2="554" stroke="#2D6CDF" stroke-width="2" stroke-dasharray="3 10" opacity="0.62"/>
  <text x="579" y="139" text-anchor="end" font-size="10" font-weight="700" letter-spacing="1.5" fill="#5B6B7A">MANUAL</text>
  <text x="621" y="139" font-size="10" font-weight="700" letter-spacing="1.5" fill="#5B6B7A">MAP + RECORD</text>

  <text x="300" y="138" text-anchor="middle" font-size="18" font-weight="700" fill="#E5484D">안티패턴 — 거대 단일 매뉴얼</text>
  <rect x="95" y="158" width="410" height="372" rx="16" fill="#FFFFFF" stroke="#E5484D" stroke-width="2.5"/>
  <line x1="119" y1="203" x2="481" y2="203" stroke="#E5484D" stroke-width="2" opacity="0.75"/>
  <text x="300" y="187" text-anchor="middle" font-size="16" font-weight="700" fill="#1B2733">AGENTS.md (1,000줄)</text>
  <circle cx="119" cy="180" r="4" fill="#E5484D" opacity="0.9"/>
  <circle cx="135" cy="180" r="4" fill="#E5484D" opacity="0.45"/>
  <circle cx="151" cy="180" r="4" fill="#E5484D" opacity="0.22"/>

  <text x="120" y="236" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#1B2733">DB는 Postgres, 마이그레이션은…</text>
  <text x="120" y="266" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#1B2733">인증은 authlib, 토큰은…</text>
  <text x="120" y="296" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#5B6B7A">에러 포맷은… (낡음)</text>
  <line x1="120" y1="291" x2="360" y2="291" stroke="#E5484D" stroke-width="2"/>
  <text x="120" y="326" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#5B6B7A">로깅 규칙은… (낡음)</text>
  <line x1="120" y1="321" x2="345" y2="321" stroke="#E5484D" stroke-width="2"/>
  <text x="120" y="356" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#1B2733">레이트리밋은…</text>
  <text x="120" y="386" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#5B6B7A">배포 절차는… (낡음)</text>
  <line x1="120" y1="381" x2="350" y2="381" stroke="#E5484D" stroke-width="2"/>
  <text x="120" y="416" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#1B2733">… 그리고 940줄 더</text>

  <path d="M150 444 H450" stroke="#E5484D" stroke-width="2" stroke-dasharray="4 8" opacity="0.65"/>
  <text x="300" y="470" text-anchor="middle" font-size="14" font-weight="700" fill="#E5484D">낡은 규칙의 무덤 · 컨텍스트 잠식</text>
  <text x="300" y="494" text-anchor="middle" font-size="14" font-weight="700" fill="#E5484D">기계 점검 불가 → 드리프트</text>

  <text x="900" y="138" text-anchor="middle" font-size="18" font-weight="700" fill="#36B37E">맵 + 기록 시스템</text>

  <rect x="745" y="158" width="310" height="78" rx="16" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="2"/>
  <text x="900" y="190" text-anchor="middle" font-size="16" font-weight="700" fill="#1B2733">AGENTS.md — 맵 (약 100줄)</text>
  <text x="900" y="216" text-anchor="middle" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#5B6B7A">담지 않고 '가리킨다'</text>

  <line x1="900" y1="238" x2="900" y2="284" stroke="#2D6CDF" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="916" y="266" font-size="13" fill="#5B6B7A">점진적 공개 — 필요한 깊이만</text>
  <text x="839" y="262" text-anchor="end" font-size="10" font-weight="700" letter-spacing="1.4" fill="#5B6B7A">FROM MAP</text>
  <line x1="846" y1="259" x2="884" y2="259" stroke="#5B6B7A" stroke-width="1.5" stroke-dasharray="3 5" opacity="0.65"/>

  <rect x="660" y="296" width="480" height="234" rx="18" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="2"/>
  <text x="900" y="324" text-anchor="middle" font-size="15" font-weight="700" fill="#1B2733">docs/ — 기록 시스템 (버전 관리)</text>
  <line x1="704" y1="333" x2="1096" y2="333" stroke="#2D6CDF" stroke-width="1.5" stroke-dasharray="3 8" opacity="0.5"/>

  <rect x="685" y="342" width="430" height="52" rx="14" fill="#FFFFFF" stroke="#36B37E" stroke-width="2"/>
  <circle cx="698" cy="368" r="4" fill="#36B37E"/>
  <text x="715" y="365" font-size="13.5" font-family="ui-monospace, Menlo, monospace" font-weight="700" fill="#1B2733">design-docs/</text>
  <text x="715" y="384" font-size="12" fill="#5B6B7A">결정·핵심 신념 (왜 Postgres인가)</text>

  <rect x="685" y="404" width="430" height="52" rx="14" fill="#FFFFFF" stroke="#36B37E" stroke-width="2"/>
  <circle cx="698" cy="430" r="4" fill="#36B37E"/>
  <text x="715" y="427" font-size="13.5" font-family="ui-monospace, Menlo, monospace" font-weight="700" fill="#1B2733">exec-plans/</text>
  <text x="715" y="446" font-size="12" fill="#5B6B7A">계획 + 의사결정 로그 (일급 아티팩트)</text>

  <rect x="685" y="466" width="430" height="52" rx="14" fill="#FFFFFF" stroke="#36B37E" stroke-width="2"/>
  <circle cx="698" cy="492" r="4" fill="#36B37E"/>
  <text x="715" y="489" font-size="13.5" font-family="ui-monospace, Menlo, monospace" font-weight="700" fill="#1B2733">references/</text>
  <text x="715" y="508" font-size="12" fill="#5B6B7A">외부 라이브러리 요약 (*-llms.txt)</text>

  <path d="M900 530 C900 548 829 556 743 558" fill="none" stroke="#36B37E" stroke-width="2.5" stroke-dasharray="4 7" marker-end="url(#arrow-green)" opacity="0.85"/>
  <text x="833" y="551" font-size="10" font-weight="700" letter-spacing="1.4" fill="#5B6B7A">TO CHECKS</text>

  <text x="600" y="588" text-anchor="middle" font-size="16" fill="#1B2733">린터·CI가 <tspan font-weight="700" fill="#36B37E">신선도·교차 링크</tspan>를 기계 점검한다(doc-gardening) — 단일 덩어리로는 불가능</text>
</svg>