  <text x="522.5" y="218" text-anchor="middle" font-size="12.5" fill="#5B6B7A">격리 컨텍스트 · 제한 도구</text>

  <rect x="420" y="239" width="205" height="72" rx="16" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="2"/>
  <text x="522.5" y="269" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1B2733">서브에이전트 B</text>
  <text x="522.5" y="291" text-anchor="middle" font-size="12.5" fill="#5B6B7A">격리 컨텍스트 · 제한 도구</text>

  <rect x="420" y="312" width="205" height="72" rx="16" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="2"/>
  <text x="522.5" y="342" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1B2733">서브에이전트 C</text>
  <text x="522.5" y="364" text-anchor="middle" font-size="12.5" fill="#5B6B7A">격리 컨텍스트 · 제한 도구</text>

  <rect x="875" y="230" width="215" height="88" rx="16" fill="#FFFFFF" stroke="#36B37E" stroke-width="2.5"/>
  <text x="982.5" y="265" text-anchor="middle" font-size="16" font-weight="700" fill="#1B2733">합류·중재</text>
