  <path d="M 292 265 C 338 265, 358 348, 416 348" fill="none" stroke="#2D6CDF" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="348" y="229" text-anchor="middle" font-size="14" font-weight="700" fill="#2D6CDF">분해</text>

  <path d="M 625 202 C 700 202, 748 252, 871 252" fill="none" stroke="#36B37E" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <line x1="625" y1="275" x2="871" y2="274" stroke="#36B37E" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <path d="M 625 348 C 700 348, 748 296, 871 296" fill="none" stroke="#36B37E" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="746" y="235" text-anchor="middle" font-size="14" font-weight="700" fill="#36B37E">병렬 팬아웃</text>

  <g stroke="#2D6CDF" stroke-width="1.5" stroke-dasharray="3 5" opacity="0.5">
    <line x1="70" y1="136" x2="182" y2="136"/>
    <line x1="198" y1="136" x2="230" y2="136"/>
  </g>

  <text x="70" y="430" font-size="12" font-weight="700" letter-spacing="1.2" fill="#2D6CDF">SERIAL PIPELINE</text>
  <text x="70" y="450" font-size="15" font-weight="700" fill="#1B2733">직렬 파이프라인</text>
  <rect x="50" y="462" width="1100" height="128" rx="16" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="2" stroke-dasharray="7 7"/>

  <text x="112" y="514" font-size="15" font-weight="700" fill="#1B2733">파이프라인(직렬)</text>
  <text x="112" y="539" font-size="13" fill="#5B6B7A">출력 요약만 다음으로 전달</text>

  <rect x="280" y="492" width="130" height="62" rx="16" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="2"/>
