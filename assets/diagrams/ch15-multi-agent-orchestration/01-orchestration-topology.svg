  <rect x="478" y="492" width="130" height="62" rx="16" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="2"/>
  <text x="543" y="530" text-anchor="middle" font-size="16" font-weight="700" fill="#1B2733">변환</text>

  <rect x="676" y="492" width="130" height="62" rx="16" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="2"/>
  <text x="741" y="530" text-anchor="middle" font-size="16" font-weight="700" fill="#1B2733">검증</text>

  <rect x="874" y="492" width="165" height="62" rx="16" fill="#FFFFFF" stroke="#36B37E" stroke-width="2.5"/>
  <text x="956.5" y="530" text-anchor="middle" font-size="16" font-weight="700" fill="#1B2733">게이트 통과?</text>

  <line x1="410" y1="523" x2="474" y2="523" stroke="#2D6CDF" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <line x1="608" y1="523" x2="672" y2="523" stroke="#2D6CDF" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <line x1="806" y1="523" x2="870" y2="523" stroke="#36B37E" stroke-width="3" marker-end="url(#arrowGreen)"/>

  <path d="M 956 554 C 956 634, 345 634, 345 558" fill="none" stroke="#2D6CDF" stroke-width="2.8" stroke-dasharray="7 7" marker-end="url(#arrowBlue)"/>
  <text x="650" y="632" text-anchor="middle" font-size="15" font-weight="700" fill="#2D6CDF">루프(원칙 7): 통과 못하면 되돌아가 다시 처리</text>

  <text x="600" y="662" text-anchor="middle" font-size="16" fill="#1B2733">오케스트레이션 = <tspan font-weight="700" fill="#2D6CDF">분해</tspan> → <tspan font-weight="700" fill="#36B37E">격리된 서브에이전트</tspan> → <tspan font-weight="700" fill="#1B2733">합류·중재</tspan>. 병렬은 팬아웃, 직렬은 <tspan font-weight="700" fill="#2D6CDF">게이트 루프(원칙 7)</tspan></text>
</svg>