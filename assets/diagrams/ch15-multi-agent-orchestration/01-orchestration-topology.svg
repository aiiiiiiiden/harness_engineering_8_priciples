<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" font-family="Apple SD Gothic Neo, sans-serif">
  <defs>
    <marker id="ok" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6.5,3 L0,6 Z" fill="#36B37E"/>
    </marker>
    <marker id="loop" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6.5,3 L0,6 Z" fill="#2D6CDF"/>
    </marker>
    <marker id="esc" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6.5,3 L0,6 Z" fill="#5B6B7A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="680" fill="#F7F9FC"/>

  <text x="600" y="48" text-anchor="middle" font-size="27" font-weight="700" fill="#1B2733">멀티 에이전트 — 두 토폴로지</text>
  <text x="600" y="80" text-anchor="middle" font-size="16" fill="#5B6B7A">오케스트레이터가 분해하고, 각 단계는 서브에이전트 · 출력 요약만 전달</text>

  <!-- 상단: 병렬 팬아웃 -->
  <text x="70" y="126" font-size="15" font-weight="700" fill="#2D6CDF">병렬 팬아웃</text>
  <rect x="50" y="142" width="1100" height="224" rx="16" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="3" stroke-dasharray="8 6"/>

  <rect x="82" y="214" width="210" height="90" rx="16" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="3"/>
  <text x="187" y="248" text-anchor="middle" font-size="16" font-weight="700" fill="#1B2733">오케스트레이터</text>
  <text x="187" y="273" text-anchor="middle" font-size="13" fill="#5B6B7A">사람이 조종</text>
  <text x="187" y="292" text-anchor="middle" font-size="12.5" fill="#5B6B7A">(원칙 1)</text>

  <rect x="420" y="156" width="205" height="72" rx="16" fill="#FFFFFF" stroke="#36B37E" stroke-width="3"/>
  <text x="522.5" y="186" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1B2733">서브에이전트 A</text>
  <text x="522.5" y="208" text-anchor="middle" font-size="12.5" fill="#5B6B7A">격리 컨텍스트 · 제한 도구</text>

  <rect x="420" y="235" width="205" height="72" rx="16" fill="#FFFFFF" stroke="#36B37E" stroke-width="3"/>
  <text x="522.5" y="265" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1B2733">서브에이전트 B</text>
  <text x="522.5" y="287" text-anchor="middle" font-size="12.5" fill="#5B6B7A">격리 컨텍스트 · 제한 도구</text>

  <rect x="420" y="314" width="205" height="72" rx="16" fill="#FFFFFF" stroke="#36B37E" stroke-width="3"/>
  <text x="522.5" y="344" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1B2733">서브에이전트 C</text>
  <text x="522.5" y="366" text-anchor="middle" font-size="12.5" fill="#5B6B7A">격리 컨텍스트 · 제한 도구</text>

  <rect x="875" y="224" width="215" height="88" rx="16" fill="#FFFFFF" stroke="#36B37E" stroke-width="3"/>
  <text x="982.5" y="259" text-anchor="middle" font-size="16" font-weight="700" fill="#1B2733">합류·중재</text>
  <text x="982.5" y="284" text-anchor="middle" font-size="13" fill="#5B6B7A">출력 요약만 수집</text>

  <path d="M 292 259 C 338 259, 358 192, 416 192" fill="none" stroke="#36B37E" stroke-width="6" marker-end="url(#ok)"/>
  <line x1="292" y1="259" x2="416" y2="271" stroke="#36B37E" stroke-width="6" marker-end="url(#ok)"/>
  <path d="M 292 259 C 338 259, 358 350, 416 350" fill="none" stroke="#36B37E" stroke-width="6" marker-end="url(#ok)"/>
  <text x="348" y="222" text-anchor="middle" font-size="14" font-weight="700" fill="#36B37E">분해</text>

  <path d="M 625 192 C 700 192, 748 246, 871 246" fill="none" stroke="#36B37E" stroke-width="6" marker-end="url(#ok)"/>
  <line x1="625" y1="271" x2="871" y2="268" stroke="#36B37E" stroke-width="6" marker-end="url(#ok)"/>
  <path d="M 625 350 C 700 350, 748 290, 871 290" fill="none" stroke="#36B37E" stroke-width="6" marker-end="url(#ok)"/>
  <text x="746" y="226" text-anchor="middle" font-size="14" font-weight="700" fill="#36B37E">병렬 팬아웃</text>

  <!-- 하단: 직렬 파이프라인 -->
  <text x="70" y="430" font-size="15" font-weight="700" fill="#2D6CDF">직렬 파이프라인</text>
  <rect x="50" y="446" width="1100" height="144" rx="16" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="3" stroke-dasharray="8 6"/>

  <text x="112" y="508" font-size="15" font-weight="700" fill="#1B2733">파이프라인(직렬)</text>
  <text x="112" y="533" font-size="13" fill="#5B6B7A">출력 요약만 다음으로 전달</text>

  <rect x="280" y="486" width="130" height="62" rx="16" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="3"/>
  <text x="345" y="524" text-anchor="middle" font-size="16" font-weight="700" fill="#1B2733">탐지</text>

  <rect x="478" y="486" width="130" height="62" rx="16" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="3"/>
  <text x="543" y="524" text-anchor="middle" font-size="16" font-weight="700" fill="#1B2733">변환</text>

  <rect x="676" y="486" width="130" height="62" rx="16" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="3"/>
  <text x="741" y="524" text-anchor="middle" font-size="16" font-weight="700" fill="#1B2733">검증</text>

  <rect x="874" y="486" width="165" height="62" rx="16" fill="#FFFFFF" stroke="#36B37E" stroke-width="3"/>
  <text x="956.5" y="524" text-anchor="middle" font-size="16" font-weight="700" fill="#1B2733">게이트 통과?</text>

  <line x1="410" y1="517" x2="474" y2="517" stroke="#36B37E" stroke-width="6" marker-end="url(#ok)"/>
  <line x1="608" y1="517" x2="672" y2="517" stroke="#36B37E" stroke-width="6" marker-end="url(#ok)"/>
  <line x1="806" y1="517" x2="870" y2="517" stroke="#36B37E" stroke-width="6" marker-end="url(#ok)"/>

  <path d="M 956 548 C 956 634, 345 634, 345 552" fill="none" stroke="#2D6CDF" stroke-width="5" stroke-dasharray="7 6" marker-end="url(#loop)"/>
  <text x="650" y="632" text-anchor="middle" font-size="15" font-weight="700" fill="#2D6CDF">루프(원칙 7): 통과 못하면 되돌아가 다시 처리</text>

  <!-- 하단 핵심 -->
  <text x="600" y="662" text-anchor="middle" font-size="16" fill="#1B2733">오케스트레이션 = <tspan font-weight="700" fill="#2D6CDF">분해</tspan> → <tspan font-weight="700" fill="#36B37E">격리된 서브에이전트</tspan> → <tspan font-weight="700" fill="#1B2733">합류·중재</tspan>. 병렬은 팬아웃, 직렬은 <tspan font-weight="700" fill="#2D6CDF">게이트 루프(원칙 7)</tspan></text>
</svg>