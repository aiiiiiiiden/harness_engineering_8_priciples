  <text x="187" y="279" text-anchor="middle" font-size="13" fill="#5B6B7A">사람이 조종</text>
  <text x="187" y="298" text-anchor="middle" font-size="12.5" fill="#5B6B7A">(원칙 1)</text>

  <rect x="420" y="166" width="205" height="72" rx="16" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="2"/>
