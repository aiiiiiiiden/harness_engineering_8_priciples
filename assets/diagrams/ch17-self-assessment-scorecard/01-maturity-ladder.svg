<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 720" font-family="Apple SD Gothic Neo, sans-serif">
  <defs>
    <marker id="arrow-pass" markerWidth="8" markerHeight="8" refX="6.2" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6.2,3 L0,6 Z" fill="#36B37E"/>
    </marker>
    <pattern id="dot-field" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.2" fill="#2D6CDF" opacity="0.16"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1420" height="720" fill="#F7F9FC"/>
  <rect x="72" y="120" width="1276" height="500" fill="url(#dot-field)" opacity="0.65"/>

  <text x="710" y="52" text-anchor="middle" font-size="27" font-weight="700" fill="#1B2733">하네스 성숙도 사다리 — L1에서 L5로</text>
  <text x="710" y="86" text-anchor="middle" font-size="16" fill="#5B6B7A">없음 → 문서화 → 구조화 → 강제 → 자율. 신뢰도는 가장 약한 원칙이 정한다</text>

  <text x="58" y="132" font-size="10" font-weight="700" letter-spacing="1.6" fill="#5B6B7A">MATURITY LADDER</text>
  <path d="M158 129 H254" fill="none" stroke="#2D6CDF" stroke-width="1.4" stroke-dasharray="3 6" opacity="0.55"/>

  <path d="M58 640 L58 612 L292 612 L292 532 L562 532 L562 452 L842 452 L842 372 L1112 372 L1112 292 L1364 292" fill="none" stroke="#BFD0E6" stroke-width="2.5" stroke-linejoin="round" opacity="0.9"/>

  <rect x="60" y="470" width="220" height="118" rx="16" fill="#FFFFFF" stroke="#E5484D" stroke-width="2"/>
  <text x="170" y="502" text-anchor="middle" font-size="16" font-weight="700" fill="#1B2733">L1 없음</text>
  <text x="170" y="525" text-anchor="middle" font-size="13" fill="#5B6B7A">(Absent)</text>
  <text x="170" y="553" text-anchor="middle" font-size="13.5" fill="#1B2733">암묵지 · 사람 머릿속</text>
  <text x="170" y="575" text-anchor="middle" font-size="12.5" fill="#5B6B7A">구조·기록·검증 없음 · 빈 레포</text>

  <rect x="330" y="390" width="220" height="118" rx="16" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="2"/>
  <text x="440" y="422" text-anchor="middle" font-size="16" font-weight="700" fill="#1B2733">L2 문서화</text>
  <text x="440" y="445" text-anchor="middle" font-size="13" fill="#5B6B7A">(Documented)</text>
  <text x="440" y="473" text-anchor="middle" font-size="13.5" fill="#1B2733">규약·사실은 글로 존재</text>
  <text x="440" y="495" text-anchor="middle" font-size="12.5" fill="#5B6B7A">강제 없음 · 사람이 약속</text>

  <rect x="600" y="310" width="230" height="118" rx="16" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="2"/>
  <text x="715" y="342" text-anchor="middle" font-size="16" font-weight="700" fill="#1B2733">L3 구조화</text>
  <text x="715" y="365" text-anchor="middle" font-size="13" fill="#5B6B7A">(Structured)</text>
  <text x="715" y="393" text-anchor="middle" font-size="13.5" fill="#1B2733">SoT·맵·스크립트 보유</text>
  <text x="715" y="415" text-anchor="middle" font-size="12.5" fill="#5B6B7A">도구 점검 가능 · 수동 실행</text>

  <rect x="870" y="230" width="230" height="118" rx="16" fill="#FFFFFF" stroke="#36B37E" stroke-width="2"/>
  <text x="985" y="262" text-anchor="middle" font-size="16" font-weight="700" fill="#1B2733">L4 강제</text>
  <text x="985" y="285" text-anchor="middle" font-size="13" fill="#5B6B7A">(Enforced)</text>
  <text x="985" y="313" text-anchor="middle" font-size="13.5" fill="#1B2733">게이트가 코드로 강제</text>
  <text x="985" y="335" text-anchor="middle" font-size="12.5" fill="#5B6B7A">미통과 시 차단 · 스크립트/CI</text>

  <rect x="1140" y="150" width="260" height="118" rx="16" fill="#FFFFFF" stroke="#36B37E" stroke-width="2"/>
  <text x="1270" y="182" text-anchor="middle" font-size="16" font-weight="700" fill="#1B2733">L5 자율</text>
  <text x="1270" y="205" text-anchor="middle" font-size="13" fill="#5B6B7A">(Autonomous)</text>
  <text x="1270" y="233" text-anchor="middle" font-size="13.2" fill="#1B2733">게이트가 루프에 인코딩</text>
  <text x="1270" y="255" text-anchor="middle" font-size="12.2" fill="#5B6B7A">모델 다양성·엔트로피 자동 GC · 자가개선</text>

  <path d="M284 530 C302 514 310 474 326 454" fill="none" stroke="#36B37E" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-pass)"/>
  <path d="M554 450 C572 434 580 394 596 374" fill="none" stroke="#36B37E" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-pass)"/>
  <path d="M834 370 C852 354 858 314 866 294" fill="none" stroke="#36B37E" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-pass)"/>
  <path d="M1104 290 C1122 274 1128 234 1136 214" fill="none" stroke="#36B37E" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-pass)"/>

  <rect x="325" y="530" width="130" height="34" rx="14" fill="#FFFFFF" stroke="#5B6B7A" stroke-width="2" stroke-dasharray="5 6"/>
  <text x="390" y="552" text-anchor="middle" font-size="14" font-weight="700" fill="#5B6B7A">기반 확보</text>

  <rect x="630" y="450" width="130" height="34" rx="14" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="2" stroke-dasharray="5 6"/>
  <text x="695" y="472" text-anchor="middle" font-size="14" font-weight="700" fill="#2D6CDF">구조화</text>

  <rect x="900" y="370" width="150" height="34" rx="14" fill="#FFFFFF" stroke="#36B37E" stroke-width="2" stroke-dasharray="5 6"/>
  <text x="975" y="392" text-anchor="middle" font-size="14" font-weight="700" fill="#36B37E">강제(코드로)</text>

  <rect x="1168" y="290" width="150" height="34" rx="14" fill="#FFFFFF" stroke="#36B37E" stroke-width="2" stroke-dasharray="5 6"/>
  <text x="1243" y="312" text-anchor="middle" font-size="14" font-weight="700" fill="#36B37E">루프 인코딩</text>

  <path d="M330 640 H1090" fill="none" stroke="#2D6CDF" stroke-width="1.4" stroke-dasharray="3 7" opacity="0.45"/>
  <text x="710" y="682" text-anchor="middle" font-size="16" fill="#1B2733">성숙도는 한 번에 오르지 않는다 — <tspan font-weight="700" fill="#2D6CDF">문서화 위에 구조</tspan>, <tspan font-weight="700" fill="#36B37E">구조 위에 기계 강제</tspan>, 그 위에 <tspan font-weight="700" fill="#36B37E">자율 루프</tspan></text>
</svg>