<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Apple SD Gothic Neo, sans-serif">
  <defs>
    <marker id="arrow-pass" markerWidth="8" markerHeight="8" refX="6.2" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6.2,3 L0,6 Z" fill="#36B37E"/>
    </marker>
    <pattern id="dot-field" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.2" fill="#2D6CDF" opacity="0.16"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1200" height="640" fill="#F7F9FC"/>
  <rect x="72" y="112" width="1056" height="420" fill="url(#dot-field)" opacity="0.65"/>

  <text x="600" y="48" text-anchor="middle" font-size="27" font-weight="700" fill="#1B2733">하네스 성숙도 사다리 — L1에서 L5로</text>
  <text x="600" y="80" text-anchor="middle" font-size="16" fill="#5B6B7A">없음 → 문서화 → 구조화 → 강제 → 자율. 신뢰도는 가장 약한 원칙이 정한다</text>

  <text x="58" y="126" font-size="10" font-weight="700" letter-spacing="1.6" fill="#5B6B7A">MATURITY LADDER</text>
  <path d="M158 123 H254" fill="none" stroke="#2D6CDF" stroke-width="1.4" stroke-dasharray="3 6" opacity="0.55"/>

  <path d="M58 536 L58 516 L258 516 L258 456 L478 456 L478 396 L698 396 L698 336 L918 336 L918 276 L1130 276" fill="none" stroke="#BFD0E6" stroke-width="2.5" stroke-linejoin="round" opacity="0.9"/>

  <rect x="50" y="408" width="200" height="108" rx="16" fill="#FFFFFF" stroke="#E5484D" stroke-width="2"/>
  <text x="150" y="438" text-anchor="middle" font-size="16" font-weight="700" fill="#1B2733">L1 없음</text>
  <text x="150" y="460" text-anchor="middle" font-size="13" fill="#5B6B7A">(Absent)</text>
  <text x="150" y="486" text-anchor="middle" font-size="13.5" fill="#1B2733">암묵지 · 사람 머릿속</text>
  <text x="150" y="506" text-anchor="middle" font-size="12.5" fill="#5B6B7A">구조·기록·검증 없음 · 빈 레포</text>

  <rect x="270" y="348" width="200" height="108" rx="16" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="2"/>
  <text x="370" y="378" text-anchor="middle" font-size="16" font-weight="700" fill="#1B2733">L2 문서화</text>
  <text x="370" y="400" text-anchor="middle" font-size="13" fill="#5B6B7A">(Documented)</text>
  <text x="370" y="426" text-anchor="middle" font-size="13.5" fill="#1B2733">규약·사실은 글로 존재</text>
  <text x="370" y="446" text-anchor="middle" font-size="12.5" fill="#5B6B7A">강제 없음 · 사람이 약속</text>

  <rect x="490" y="288" width="200" height="108" rx="16" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="2"/>
  <text x="590" y="318" text-anchor="middle" font-size="16" font-weight="700" fill="#1B2733">L3 구조화</text>
  <text x="590" y="340" text-anchor="middle" font-size="13" fill="#5B6B7A">(Structured)</text>
  <text x="590" y="366" text-anchor="middle" font-size="13.5" fill="#1B2733">SoT·맵·스크립트 보유</text>
  <text x="590" y="386" text-anchor="middle" font-size="12.5" fill="#5B6B7A">도구 점검 가능 · 수동 실행</text>

  <rect x="710" y="228" width="200" height="108" rx="16" fill="#FFFFFF" stroke="#36B37E" stroke-width="2"/>
  <text x="810" y="258" text-anchor="middle" font-size="16" font-weight="700" fill="#1B2733">L4 강제</text>
  <text x="810" y="280" text-anchor="middle" font-size="13" fill="#5B6B7A">(Enforced)</text>
  <text x="810" y="306" text-anchor="middle" font-size="13.5" fill="#1B2733">게이트가 코드로 강제</text>
  <text x="810" y="326" text-anchor="middle" font-size="12.5" fill="#5B6B7A">미통과 시 차단 · 스크립트/CI</text>

  <rect x="930" y="168" width="220" height="108" rx="16" fill="#FFFFFF" stroke="#36B37E" stroke-width="2"/>
  <text x="1040" y="198" text-anchor="middle" font-size="16" font-weight="700" fill="#1B2733">L5 자율</text>
  <text x="1040" y="220" text-anchor="middle" font-size="13" fill="#5B6B7A">(Autonomous)</text>
  <text x="1040" y="246" text-anchor="middle" font-size="13.2" fill="#1B2733">게이트가 루프에 인코딩</text>
  <text x="1040" y="266" text-anchor="middle" font-size="12.2" fill="#5B6B7A">모델 다양성·엔트로피 자동 GC · 자가개선</text>

  <line x1="250" y1="462" x2="266" y2="414" stroke="#36B37E" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-pass)"/>
  <line x1="470" y1="402" x2="486" y2="354" stroke="#36B37E" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-pass)"/>
  <line x1="690" y1="342" x2="706" y2="294" stroke="#36B37E" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-pass)"/>
  <line x1="910" y1="282" x2="926" y2="234" stroke="#36B37E" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-pass)"/>

  <rect x="292" y="470" width="116" height="34" rx="14" fill="#FFFFFF" stroke="#5B6B7A" stroke-width="2" stroke-dasharray="5 6"/>
  <text x="350" y="492" text-anchor="middle" font-size="14" font-weight="700" fill="#5B6B7A">기반 확보</text>

  <rect x="512" y="410" width="116" height="34" rx="14" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="2" stroke-dasharray="5 6"/>
  <text x="570" y="432" text-anchor="middle" font-size="14" font-weight="700" fill="#2D6CDF">구조화</text>

  <rect x="708" y="350" width="140" height="34" rx="14" fill="#FFFFFF" stroke="#36B37E" stroke-width="2" stroke-dasharray="5 6"/>
  <text x="778" y="372" text-anchor="middle" font-size="14" font-weight="700" fill="#36B37E">강제(코드로)</text>

  <rect x="920" y="290" width="142" height="34" rx="14" fill="#FFFFFF" stroke="#36B37E" stroke-width="2" stroke-dasharray="5 6"/>
  <text x="991" y="312" text-anchor="middle" font-size="14" font-weight="700" fill="#36B37E">루프 인코딩</text>

  <path d="M330 548 H870" fill="none" stroke="#2D6CDF" stroke-width="1.4" stroke-dasharray="3 7" opacity="0.45"/>
  <text x="600" y="588" text-anchor="middle" font-size="16" fill="#1B2733">성숙도는 한 번에 오르지 않는다 — <tspan font-weight="700" fill="#2D6CDF">문서화 위에 구조</tspan>, <tspan font-weight="700" fill="#36B37E">구조 위에 기계 강제</tspan>, 그 위에 <tspan font-weight="700" fill="#36B37E">자율 루프</tspan></text>
</svg>