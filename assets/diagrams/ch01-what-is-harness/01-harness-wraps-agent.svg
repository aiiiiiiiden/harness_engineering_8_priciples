<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="Apple SD Gothic Neo, sans-serif">
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6.2" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6.2,3 L0,6 Z" fill="#2D6CDF"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6.2" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6.2,3 L0,6 Z" fill="#36B37E"/>
    </marker>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="6.2" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6.2,3 L0,6 Z" fill="#5B6B7A"/>
    </marker>
    <pattern id="dot-field" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.2" fill="#2D6CDF" opacity="0.12"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1200" height="720" fill="#F7F9FC"/>
  <rect x="42" y="112" width="1116" height="508" fill="url(#dot-field)" opacity="0.7"/>

  <text x="600" y="50" text-anchor="middle" font-size="27" font-weight="700" fill="#1B2733">하네스 — 에이전트를 감싸는 환경 전체</text>
  <text x="600" y="82" text-anchor="middle" font-size="16" fill="#5B6B7A">모델의 한 번의 호출은 에이전트의 몫, 그 둘레가 전부 하네스다</text>

  <rect x="170" y="124" width="860" height="486" rx="24" fill="none" stroke="#2D6CDF" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="190" y="151" font-size="11" font-weight="700" letter-spacing="1.5" fill="#2D6CDF">HARNESS</text>
  <text x="190" y="171" font-size="13" font-weight="700" fill="#1B2733">에이전트를 둘러싼 실행 환경</text>

  <rect x="430" y="315" width="340" height="115" rx="16" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="2.5"/>
  <text x="600" y="357" text-anchor="middle" font-size="21" font-weight="700" fill="#1B2733">코딩 에이전트</text>
  <text x="600" y="386" text-anchor="middle" font-size="15" fill="#5B6B7A">모델의 한 번의 호출</text>
  <text x="600" y="410" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1.4" fill="#2D6CDF">AGENT</text>

  <rect x="210" y="165" width="320" height="110" rx="16" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="2"/>
  <text x="370" y="207" text-anchor="middle" font-size="17" font-weight="700" fill="#1B2733">기록 시스템</text>
  <text x="370" y="233" text-anchor="middle" font-size="13.5" fill="#5B6B7A">문서·스키마·계획</text>
  <text x="370" y="255" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2D6CDF">원칙 3·4</text>

  <rect x="670" y="165" width="320" height="110" rx="16" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="2"/>
  <text x="830" y="203" text-anchor="middle" font-size="17" font-weight="700" fill="#1B2733">기계적 불변식</text>
  <text x="830" y="229" text-anchor="middle" font-size="13.5" fill="#5B6B7A">린터·구조적 테스트</text>
  <text x="830" y="251" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2D6CDF">빌드가 막음 · 원칙 5</text>

  <rect x="210" y="490" width="320" height="110" rx="16" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="2"/>
  <text x="370" y="532" text-anchor="middle" font-size="17" font-weight="700" fill="#1B2733">관측성</text>
  <text x="370" y="558" text-anchor="middle" font-size="13.5" fill="#5B6B7A">로그·메트릭·화면</text>
  <text x="370" y="580" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2D6CDF">에이전트의 눈 · 원칙 2</text>

  <rect x="670" y="490" width="320" height="110" rx="16" fill="#FFFFFF" stroke="#36B37E" stroke-width="2.5"/>
  <text x="830" y="528" text-anchor="middle" font-size="17" font-weight="700" fill="#1B2733">피드백 루프</text>
  <text x="830" y="554" text-anchor="middle" font-size="13.5" fill="#5B6B7A">실패를 스스로 재현·수정</text>
  <text x="830" y="576" text-anchor="middle" font-size="12.5" font-weight="700" fill="#36B37E">원칙 1·7·8</text>

  <line x1="440" y1="275" x2="520" y2="315" stroke="#2D6CDF" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <line x1="760" y1="275" x2="680" y2="315" stroke="#2D6CDF" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <line x1="440" y1="490" x2="520" y2="430" stroke="#2D6CDF" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <line x1="760" y1="490" x2="680" y2="430" stroke="#36B37E" stroke-width="3" marker-end="url(#arrow-green)"/>

  <text x="493" y="300" font-size="9.5" font-weight="700" letter-spacing="1.2" fill="#2D6CDF">CONTEXT</text>
  <text x="681" y="300" font-size="9.5" font-weight="700" letter-spacing="1.2" fill="#2D6CDF">GUARD</text>
  <text x="462" y="466" font-size="9.5" font-weight="700" letter-spacing="1.2" fill="#2D6CDF">OBSERVE</text>
  <text x="706" y="466" font-size="9.5" font-weight="700" letter-spacing="1.2" fill="#36B37E">RETRY</text>

  <path d="M 392 292 C 458 286, 518 292, 565 315" fill="none" stroke="#5B6B7A" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#arrow-gray)"/>
  <path d="M 600 430 C 620 466, 740 452, 794 468 C 812 473, 823 481, 826 490" fill="none" stroke="#5B6B7A" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#arrow-gray)"/>
  <text x="600" y="293" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1.3" fill="#5B6B7A">FROM HARNESS ┄▶ TO AGENT</text>
  <text x="600" y="465" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1.3" fill="#5B6B7A">FROM FAILURE ┄▶ TO FIX</text>

  <line x1="112" y1="650" x2="1088" y2="650" stroke="#D8E2F0" stroke-width="1"/>
  <text x="600" y="690" text-anchor="middle" font-size="16" fill="#1B2733">하네스는 <tspan font-weight="700" fill="#E5484D">모델을 더 똑똑하게</tspan> 만드는 게 아니라, <tspan font-weight="700" fill="#2D6CDF">똑똑한 모델이 제대로 일할 환경</tspan>을 만든다</text>
</svg>