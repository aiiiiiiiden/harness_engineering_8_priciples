<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="Apple SD Gothic Neo, sans-serif">
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6.2" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6.2,3 L0,6 Z" fill="#2D6CDF"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6.2" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6.2,3 L0,6 Z" fill="#36B37E"/>
    </marker>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="6.2" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6.2,3 L0,6 Z" fill="#5B6B7A"/>
    </marker>
    <pattern id="dot-field" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.2" fill="#2D6CDF" opacity="0.12"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1200" height="660" fill="#F7F9FC"/>
  <rect x="42" y="112" width="1116" height="430" fill="url(#dot-field)" opacity="0.7"/>

  <text x="600" y="50" text-anchor="middle" font-size="27" font-weight="700" fill="#1B2733">하네스 — 에이전트를 감싸는 환경 전체</text>
  <text x="600" y="82" text-anchor="middle" font-size="16" fill="#5B6B7A">모델의 한 번의 호출은 에이전트의 몫, 그 둘레가 전부 하네스다</text>

  <rect x="170" y="124" width="860" height="408" rx="24" fill="none" stroke="#2D6CDF" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="190" y="151" font-size="11" font-weight="700" letter-spacing="1.5" fill="#2D6CDF">HARNESS</text>
  <text x="190" y="171" font-size="13" font-weight="700" fill="#1B2733">에이전트를 둘러싼 실행 환경</text>

  <rect x="446" y="276" width="308" height="114" rx="16" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="2.5"/>
  <text x="600" y="318" text-anchor="middle" font-size="21" font-weight="700" fill="#1B2733">코딩 에이전트</text>
  <text x="600" y="347" text-anchor="middle" font-size="15" fill="#5B6B7A">모델의 한 번의 호출</text>
  <text x="600" y="371" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1.4" fill="#2D6CDF">AGENT</text>

  <rect x="250" y="154" width="288" height="104" rx="16" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="2"/>
  <text x="394" y="194" text-anchor="middle" font-size="17" font-weight="700" fill="#1B2733">기록 시스템</text>
  <text x="394" y="220" text-anchor="middle" font-size="13.5" fill="#5B6B7A">문서·스키마·계획</text>
  <text x="394" y="242" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2D6CDF">원칙 3·4</text>

  <rect x="662" y="154" width="288" height="104" rx="16" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="2"/>
  <text x="806" y="190" text-anchor="middle" font-size="17" font-weight="700" fill="#1B2733">기계적 불변식</text>
  <text x="806" y="216" text-anchor="middle" font-size="13.5" fill="#5B6B7A">린터·구조적 테스트</text>
  <text x="806" y="238" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2D6CDF">빌드가 막음 · 원칙 5</text>

  <rect x="250" y="414" width="288" height="104" rx="16" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="2"/>
  <text x="394" y="454" text-anchor="middle" font-size="17" font-weight="700" fill="#1B2733">관측성</text>
  <text x="394" y="480" text-anchor="middle" font-size="13.5" fill="#5B6B7A">로그·메트릭·화면</text>
  <text x="394" y="502" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2D6CDF">에이전트의 눈 · 원칙 2</text>

  <rect x="662" y="414" width="288" height="104" rx="16" fill="#FFFFFF" stroke="#36B37E" stroke-width="2.5"/>
  <text x="806" y="450" text-anchor="middle" font-size="17" font-weight="700" fill="#1B2733">피드백 루프</text>
  <text x="806" y="476" text-anchor="middle" font-size="13.5" fill="#5B6B7A">실패를 스스로 재현·수정</text>
  <text x="806" y="498" text-anchor="middle" font-size="12.5" font-weight="700" fill="#36B37E">원칙 1·7·8</text>

  <line x1="460" y1="258" x2="518" y2="296" stroke="#2D6CDF" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <line x1="740" y1="258" x2="682" y2="296" stroke="#2D6CDF" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <line x1="460" y1="414" x2="518" y2="376" stroke="#2D6CDF" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <line x1="740" y1="414" x2="682" y2="376" stroke="#36B37E" stroke-width="3" marker-end="url(#arrow-green)"/>

  <text x="485" y="276" font-size="9.5" font-weight="700" letter-spacing="1.2" fill="#2D6CDF">CONTEXT</text>
  <text x="690" y="276" font-size="9.5" font-weight="700" letter-spacing="1.2" fill="#2D6CDF">GUARD</text>
  <text x="472" y="402" font-size="9.5" font-weight="700" letter-spacing="1.2" fill="#2D6CDF">OBSERVE</text>
  <text x="697" y="402" font-size="9.5" font-weight="700" letter-spacing="1.2" fill="#36B37E">RETRY</text>

  <path d="M 600 276 C 600 232, 394 286, 394 263" fill="none" stroke="#5B6B7A" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#arrow-gray)"/>
  <path d="M 600 390 C 600 438, 806 382, 806 408" fill="none" stroke="#5B6B7A" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#arrow-gray)"/>
  <text x="600" y="249" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1.3" fill="#5B6B7A">FROM HARNESS ┄▶ TO AGENT</text>
  <text x="600" y="435" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1.3" fill="#5B6B7A">FROM FAILURE ┄▶ TO FIX</text>

  <line x1="112" y1="566" x2="1088" y2="566" stroke="#D8E2F0" stroke-width="1"/>
  <text x="600" y="606" text-anchor="middle" font-size="16" fill="#1B2733">하네스는 <tspan font-weight="700" fill="#E5484D">모델을 더 똑똑하게</tspan> 만드는 게 아니라, <tspan font-weight="700" fill="#2D6CDF">똑똑한 모델이 제대로 일할 환경</tspan>을 만든다</text>
</svg>