<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" font-family="Apple SD Gothic Neo, sans-serif">
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6.2" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6.2,3 L0,6 Z" fill="#2D6CDF"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6.2" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6.2,3 L0,6 Z" fill="#36B37E"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="6.2" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6.2,3 L0,6 Z" fill="#E5484D"/>
    </marker>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="6.2" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6.2,3 L0,6 Z" fill="#5B6B7A"/>
    </marker>
    <pattern id="dot-field" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.2" fill="#2D6CDF" opacity="0.12"/>
    </pattern>
    <filter id="soft-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="680" fill="#F7F9FC"/>
  <rect x="42" y="106" width="1116" height="444" fill="url(#dot-field)" opacity="0.7"/>

  <text x="600" y="50" text-anchor="middle" font-size="27" font-weight="700" fill="#1B2733">에이전트 가독성 — 못 보면 존재하지 않는다</text>
  <text x="600" y="82" text-anchor="middle" font-size="16" fill="#5B6B7A">매번 처음 보는 신입이 코드만 읽고 추론할 수 있는가</text>

  <text x="92" y="126" font-size="11" font-weight="700" letter-spacing="1.4" fill="#E5484D">INVISIBLE</text>
  <text x="92" y="150" font-size="18" font-weight="700" fill="#E5484D">가독성 낮음</text>
  <line x1="92" y1="160" x2="296" y2="160" stroke="#E5484D" stroke-width="2.5" stroke-dasharray="5 6" marker-end="url(#arrow-red)"/>

  <text x="690" y="126" font-size="11" font-weight="700" letter-spacing="1.4" fill="#36B37E">LEGIBLE</text>
  <text x="690" y="150" font-size="18" font-weight="700" fill="#1B2733">가독성 높음 — <tspan fill="#36B37E">원칙 4</tspan></text>
  <line x1="690" y1="160" x2="920" y2="160" stroke="#36B37E" stroke-width="2.5" stroke-dasharray="5 6" marker-end="url(#arrow-green)"/>

  <line x1="600" y1="124" x2="600" y2="536" stroke="#D8E2F0" stroke-width="1.5" stroke-dasharray="8 8"/>

  <rect x="76" y="190" width="248" height="86" rx="16" fill="#FFFFFF" stroke="#E5484D" stroke-width="2"/>
  <text x="200" y="224" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1B2733">규칙이 Slack·시니어</text>
  <text x="200" y="247" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1B2733">머릿속에만 있음</text>
  <text x="200" y="266" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.2" fill="#E5484D">OUT OF CONTEXT</text>

  <rect x="80" y="302" width="238" height="82" rx="16" fill="#FFFFFF" stroke="#E5484D" stroke-width="2" opacity="0.45" filter="url(#soft-blur)"/>
  <text x="199" y="337" text-anchor="middle" font-size="14.5" font-weight="700" fill="#5B6B7A" opacity="0.55">에이전트의 눈에</text>
  <text x="199" y="360" text-anchor="middle" font-size="14.5" font-weight="700" fill="#5B6B7A" opacity="0.55">안 보이는 영역</text>

  <rect x="360" y="190" width="220" height="86" rx="16" fill="#FFFFFF" stroke="#E5484D" stroke-width="2"/>
  <text x="470" y="224" text-anchor="middle" font-size="15" font-weight="700" fill="#1B2733">에이전트가 물리 삭제를</text>
  <text x="470" y="247" text-anchor="middle" font-size="15" font-weight="700" fill="#1B2733">짠다</text>
  <text x="470" y="267" text-anchor="middle" font-size="12.5" fill="#5B6B7A">(기본값)</text>

  <rect x="360" y="334" width="220" height="86" rx="16" fill="#FFFFFF" stroke="#E5484D" stroke-width="2.5"/>
  <text x="470" y="370" text-anchor="middle" font-size="16" font-weight="700" fill="#E5484D">데이터 사라짐</text>
  <text x="470" y="394" text-anchor="middle" font-size="12.5" fill="#5B6B7A">결정은 있었지만 보이지 않았다</text>

  <line x1="324" y1="233" x2="354" y2="233" stroke="#E5484D" stroke-width="3" marker-end="url(#arrow-red)"/>
  <line x1="470" y1="276" x2="470" y2="328" stroke="#E5484D" stroke-width="3" marker-end="url(#arrow-red)"/>
  <path d="M 318 342 C 338 342, 338 233, 354 233" fill="none" stroke="#5B6B7A" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#arrow-gray)" opacity="0.6"/>
  <text x="312" y="312" font-size="10" font-weight="700" letter-spacing="1.2" fill="#5B6B7A" transform="rotate(-90 312 312)">NOT VISIBLE</text>

  <rect x="660" y="190" width="232" height="82" rx="16" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="2"/>
  <text x="776" y="222" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1B2733">docs/design-docs/</text>
  <text x="776" y="244" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1B2733">soft-delete.md 결정 기록</text>
  <text x="776" y="263" text-anchor="middle" font-size="12.5" fill="#5B6B7A">(원칙 3)</text>

  <rect x="660" y="302" width="232" height="82" rx="16" fill="#FFFFFF" stroke="#36B37E" stroke-width="2"/>
  <text x="776" y="333" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1B2733">deleted_at만 쓰게</text>
  <text x="776" y="355" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1B2733">구조적 테스트</text>
  <text x="776" y="374" text-anchor="middle" font-size="12.5" fill="#5B6B7A">(원칙 5)</text>

  <rect x="660" y="414" width="232" height="82" rx="16" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="2"/>
  <text x="776" y="448" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1B2733">schema.sql에</text>
  <text x="776" y="470" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1B2733">컬럼 버전관리</text>

  <rect x="962" y="246" width="192" height="150" rx="16" fill="#FFFFFF" stroke="#36B37E" stroke-width="2.5"/>
  <text x="1058" y="286" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1B2733">에이전트가</text>
  <text x="1058" y="310" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1B2733">코드·스키마·문서만</text>
  <text x="1058" y="334" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1B2733">읽고 규칙 추론</text>
  <text x="1058" y="368" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#36B37E">SOFT DELETE</text>

  <line x1="892" y1="231" x2="956" y2="288" stroke="#36B37E" stroke-width="3" marker-end="url(#arrow-green)"/>
  <line x1="892" y1="343" x2="956" y2="321" stroke="#36B37E" stroke-width="3" marker-end="url(#arrow-green)"/>
  <line x1="892" y1="455" x2="956" y2="356" stroke="#36B37E" stroke-width="3" marker-end="url(#arrow-green)"/>

  <text x="905" y="216" font-size="9.5" font-weight="700" letter-spacing="1.1" fill="#36B37E">READ</text>
  <text x="906" y="337" font-size="9.5" font-weight="700" letter-spacing="1.1" fill="#36B37E">TEST</text>
  <text x="904" y="432" font-size="9.5" font-weight="700" letter-spacing="1.1" fill="#2D6CDF">SCHEMA</text>

  <path d="M 1058 396 C 1058 510, 776 532, 776 502" fill="none" stroke="#2D6CDF" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrow-blue)"/>
  <text x="928" y="530" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1.3" fill="#5B6B7A">FROM CODEBASE ┄▶ TO INFERENCE</text>

  <line x1="112" y1="578" x2="1088" y2="578" stroke="#D8E2F0" stroke-width="1"/>
  <text x="600" y="620" text-anchor="middle" font-size="16" fill="#1B2733">컨텍스트에서 접근 못 하는 것은 <tspan font-weight="700" fill="#E5484D">에이전트에겐 존재하지 않는다</tspan> — 코드베이스를 <tspan font-weight="700" fill="#2D6CDF">추론 가능</tspan>하게</text>
</svg>