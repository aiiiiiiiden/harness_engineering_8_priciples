<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 740" font-family="Apple SD Gothic Neo, sans-serif">
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6.4" refY="3.2" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6.4,3.2 L0,6.4 Z" fill="#2D6CDF"/>
    </marker>
    <marker id="arrow-ink" markerWidth="8" markerHeight="8" refX="6.4" refY="3.2" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6.4,3.2 L0,6.4 Z" fill="#1B2733"/>
    </marker>
    <marker id="arrow-ok" markerWidth="8" markerHeight="8" refX="6.4" refY="3.2" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6.4,3.2 L0,6.4 Z" fill="#36B37E"/>
    </marker>
    <marker id="arrow-block" markerWidth="8" markerHeight="8" refX="6.4" refY="3.2" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6.4,3.2 L0,6.4 Z" fill="#E5484D"/>
    </marker>
    <style>
      .title{font-size:27px;font-weight:700;fill:#1B2733}
      .subtitle{font-size:16px;fill:#5B6B7A}
      .box{fill:#FFFFFF;stroke:#2D6CDF;stroke-width:2}
      .box-ink{fill:#FFFFFF;stroke:#1B2733;stroke-width:2}
      .box-ok{fill:#FFFFFF;stroke:#36B37E;stroke-width:2.5}
      .box-block{fill:#FFFFFF;stroke:#E5484D;stroke-width:2;stroke-dasharray:7 7}
      .label{font-size:15.5px;font-weight:700;fill:#1B2733}
      .small{font-size:12.5px;fill:#5B6B7A}
      .micro{font-size:10.5px;font-weight:700;letter-spacing:.08em;fill:#5B6B7A}
      .flow{fill:none;stroke:#2D6CDF;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round}
      .ok-flow{fill:none;stroke:#36B37E;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .block-flow{fill:none;stroke:#E5484D;stroke-width:2.6;stroke-linecap:round;stroke-dasharray:6 7}
      .dot{fill:#2D6CDF;opacity:.17}
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="740" fill="#F7F9FC"/>

  <g>
    <circle class="dot" cx="58" cy="94" r="2"/>
    <circle class="dot" cx="83" cy="124" r="1.7"/>
    <circle class="dot" cx="112" cy="86" r="1.5"/>
    <circle class="dot" cx="156" cy="118" r="2"/>
    <circle class="dot" cx="1135" cy="92" r="1.8"/>
    <circle class="dot" cx="1170" cy="127" r="2"/>
    <circle class="dot" cx="1202" cy="88" r="1.5"/>
    <circle class="dot" cx="1227" cy="132" r="1.7"/>
  </g>

  <text x="640" y="49" text-anchor="middle" class="title">골든 워크플로우 — 구조에서 발행까지</text>
  <text x="640" y="80" text-anchor="middle" class="subtitle">구조(SoT)에서 시작해 결정론 생성 + 4중 게이트를 통과해야 발행된다</text>

  <rect x="42" y="274" width="164" height="98" rx="16" class="box"/>
  <text x="124" y="314" text-anchor="middle" class="label">docs/toc.json</text>
  <text x="124" y="338" text-anchor="middle" class="small">구조 SoT</text>
  <text x="124" y="392" text-anchor="middle" class="small">원칙 3 — 구조 단일 원천</text>

  <rect x="292" y="274" width="176" height="98" rx="16" class="box"/>
  <text x="380" y="315" text-anchor="middle" class="label">manuscript/*.md</text>
  <text x="380" y="340" text-anchor="middle" class="small">골격</text>

  <rect x="548" y="274" width="142" height="98" rx="16" class="box-ink"/>
  <text x="619" y="315" text-anchor="middle" class="label">status:</text>
  <text x="619" y="342" text-anchor="middle" font-size="18" font-weight="700" fill="#1B2733">draft</text>

  <path d="M206 323 H288" class="flow" marker-end="url(#arrow-blue)"/>
  <text x="247" y="296" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1B2733">scaffold.py</text>
  <text x="247" y="392" text-anchor="middle" class="small">결정론 생성 · 14장</text>

  <path d="M468 323 H544" class="flow" marker-end="url(#arrow-blue)"/>
  <text x="506" y="296" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1B2733">집필</text>

  <rect x="740" y="122" width="290" height="438" rx="16" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="2" stroke-dasharray="7 8"/>
  <text x="885" y="154" text-anchor="middle" font-size="17" font-weight="700" fill="#1B2733">4중 검증 게이트</text>
  <text x="885" y="178" text-anchor="middle" font-size="13" fill="#5B6B7A">직렬이 아니라 모두 통과해야 합류</text>

  <rect x="765" y="204" width="240" height="58" rx="14" class="box"/>
  <text x="885" y="229" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1B2733">1) verify.py</text>
  <text x="885" y="249" text-anchor="middle" class="small">기계·결정론 · 원칙 5</text>

  <rect x="765" y="282" width="240" height="58" rx="14" class="box"/>
  <text x="885" y="306" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1B2733">2) md-doc-reviewer</text>
  <text x="885" y="326" text-anchor="middle" class="small">같은 모델 심층 검수</text>

  <rect x="765" y="360" width="240" height="68" rx="14" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="2.5"/>
  <text x="885" y="386" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1B2733">3) crosscheck.py</text>
  <text x="885" y="407" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2D6CDF">codex = 독립 모델 교차검증</text>
  <text x="885" y="423" text-anchor="middle" font-size="11.5" fill="#5B6B7A">원칙 1 · 13장 — 모델 다양성</text>

  <rect x="765" y="448" width="240" height="58" rx="14" class="box"/>
  <text x="885" y="472" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1B2733">4) humanize</text>
  <text x="885" y="492" text-anchor="middle" class="small">문체 윤문</text>

  <path d="M690 323 C718 323 716 233 761 233" class="flow" marker-end="url(#arrow-blue)"/>
  <path d="M690 323 C718 323 716 311 761 311" class="flow" marker-end="url(#arrow-blue)"/>
  <path d="M690 323 C718 323 716 394 761 394" class="flow" marker-end="url(#arrow-blue)"/>
  <path d="M690 323 C718 323 716 477 761 477" class="flow" marker-end="url(#arrow-blue)"/>

  <path d="M1005 233 C1038 233 1052 292 1068 323" class="ok-flow"/>
  <path d="M1005 311 C1038 311 1048 318 1068 323" class="ok-flow"/>
  <path d="M1005 394 C1038 394 1052 354 1068 323" class="ok-flow"/>
  <path d="M1005 477 C1038 477 1056 375 1068 323" class="ok-flow"/>
  <path d="M1068 323 H1096" class="ok-flow" marker-end="url(#arrow-ok)"/>
  <text x="1062" y="290" text-anchor="middle" font-size="12.5" font-weight="700" fill="#36B37E">모두 통과 합류</text>

  <rect x="1100" y="274" width="145" height="98" rx="16" class="box-ok"/>
  <text x="1172.5" y="315" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1B2733">status:</text>
  <text x="1172.5" y="342" text-anchor="middle" font-size="18" font-weight="700" fill="#36B37E">reviewed</text>

  <rect x="1100" y="460" width="145" height="82" rx="16" class="box-ok"/>
  <text x="1172.5" y="494" text-anchor="middle" font-size="16" font-weight="700" fill="#1B2733">발행</text>
  <text x="1172.5" y="519" text-anchor="middle" font-size="13" fill="#5B6B7A">wikidocs</text>

  <path d="M1172.5 372 V456" class="ok-flow" marker-end="url(#arrow-ok)"/>
  <text x="1204" y="422" text-anchor="middle" font-size="12.5" font-weight="700" fill="#36B37E">통과</text>

  <rect x="740" y="586" width="290" height="48" rx="14" class="box-block"/>
  <text x="885" y="615" text-anchor="middle" font-size="15" font-weight="700" fill="#E5484D">하나라도 실패하면 차단</text>
  <path d="M885 560 V582" class="block-flow" marker-end="url(#arrow-block)"/>

  <g>
    <text x="86" y="672" class="micro">STRUCTURE(SOT)</text>
    <path d="M190 668 C330 668 428 668 548 668" fill="none" stroke="#5B6B7A" stroke-width="1.4" stroke-dasharray="2 8" stroke-linecap="round" marker-end="url(#arrow-ink)"/>
    <text x="568" y="672" class="micro">GATES</text>
    <path d="M615 668 C775 668 930 668 1100 668" fill="none" stroke="#5B6B7A" stroke-width="1.4" stroke-dasharray="2 8" stroke-linecap="round" marker-end="url(#arrow-ink)"/>
    <text x="1124" y="672" class="micro">PUBLISHED</text>
  </g>

  <text x="640" y="706" text-anchor="middle" font-size="15.5" fill="#1B2733">
    구조가 <tspan font-weight="700" fill="#2D6CDF">진실의 원천</tspan> — <tspan font-weight="700" fill="#1B2733">결정론 생성</tspan>과 <tspan font-weight="700" fill="#2D6CDF">4중 게이트(기계·Claude·codex·문체)</tspan>를 <tspan font-weight="700" fill="#36B37E">통과한 것만 발행</tspan>된다
  </text>
</svg>