  <text x="117" y="386" text-anchor="middle" font-size="12.5" fill="#5B6B7A">원칙 3 — 구조 단일 원천</text>

  <rect x="284" y="276" width="176" height="92" rx="16" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="3"/>
  <text x="372" y="315" text-anchor="middle" font-size="16" font-weight="700" fill="#1B2733">manuscript/*.md</text>
  <text x="372" y="340" text-anchor="middle" font-size="13" fill="#5B6B7A">골격</text>

  <rect x="544" y="276" width="140" height="92" rx="16" fill="#FFFFFF" stroke="#36B37E" stroke-width="3"/>
