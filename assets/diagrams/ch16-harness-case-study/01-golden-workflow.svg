  <text x="614" y="342" text-anchor="middle" font-size="18" font-weight="700" fill="#36B37E">draft</text>

  <line x1="200" y1="322" x2="280" y2="322" stroke="#36B37E" stroke-width="6" marker-end="url(#ok)"/>
  <text x="240" y="296" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1B2733">scaffold.py</text>
  <text x="240" y="385" text-anchor="middle" font-size="12.5" fill="#5B6B7A">결정론 생성 · 14장</text>

