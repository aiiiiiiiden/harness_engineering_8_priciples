  <rect x="0" y="0" width="1200" height="680" fill="#F7F9FC"/>

  <text x="600" y="48" text-anchor="middle" font-size="27" font-weight="700" fill="#1B2733">골든 워크플로우 — 구조에서 발행까지</text>
  <text x="600" y="80" text-anchor="middle" font-size="16" fill="#5B6B7A">구조(SoT)에서 시작해 결정론 생성 + 4중 게이트를 통과해야 발행된다</text>

  <rect x="34" y="276" width="166" height="92" rx="16" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="3"/>
  <text x="117" y="315" text-anchor="middle" font-size="16" font-weight="700" fill="#1B2733">docs/toc.json</text>
