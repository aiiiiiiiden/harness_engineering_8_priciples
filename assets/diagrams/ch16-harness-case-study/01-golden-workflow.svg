  <text x="500" y="296" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1B2733">집필</text>

  <rect x="720" y="124" width="270" height="410" rx="16" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="3" stroke-dasharray="8 6"/>
