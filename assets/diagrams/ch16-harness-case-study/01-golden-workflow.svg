  <text x="855" y="492" text-anchor="middle" font-size="12.5" fill="#5B6B7A">문체 윤문</text>

  <path d="M 684 322 C 704 322, 704 233, 741 233" fill="none" stroke="#36B37E" stroke-width="5" marker-end="url(#ok)"/>
