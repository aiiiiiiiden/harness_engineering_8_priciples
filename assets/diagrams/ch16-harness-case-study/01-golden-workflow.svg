  <path d="M 684 322 C 704 322, 704 477, 741 477" fill="none" stroke="#36B37E" stroke-width="5" marker-end="url(#ok)"/>

  <path d="M 965 233 C 995 233, 1000 322, 1020 322" fill="none" stroke="#36B37E" stroke-width="5"/>
