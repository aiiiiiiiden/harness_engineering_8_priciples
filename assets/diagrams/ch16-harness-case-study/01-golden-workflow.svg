  <rect x="745" y="282" width="220" height="58" rx="14" fill="#FFFFFF" stroke="#36B37E" stroke-width="3"/>
  <text x="855" y="306" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1B2733">2) md-doc-reviewer</text>
  <text x="855" y="326" text-anchor="middle" font-size="12.5" fill="#5B6B7A">같은 모델 심층 검수</text>

  <rect x="745" y="360" width="220" height="68" rx="14" fill="#FFFFFF" stroke="#2D6CDF" stroke-width="3"/>
  <text x="855" y="386" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1B2733">3) crosscheck.py</text>
  <text x="855" y="407" text-anchor="middle" font-size="12.5" fill="#2D6CDF">codex = 독립 모델 교차검증</text>
  <text x="855" y="423" text-anchor="middle" font-size="11.5" fill="#5B6B7A">원칙 1 · 13장 — 모델 다양성</text>

  <rect x="745" y="448" width="220" height="58" rx="14" fill="#FFFFFF" stroke="#36B37E" stroke-width="3"/>
