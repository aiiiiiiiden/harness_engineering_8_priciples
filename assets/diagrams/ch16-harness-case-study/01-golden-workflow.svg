  <path d="M 965 477 C 995 477, 1000 322, 1020 322" fill="none" stroke="#36B37E" stroke-width="5"/>
  <line x1="1020" y1="322" x2="1032" y2="322" stroke="#36B37E" stroke-width="6" marker-end="url(#ok)"/>

  <rect x="1036" y="276" width="132" height="92" rx="16" fill="#FFFFFF" stroke="#36B37E" stroke-width="3"/>
  <text x="1102" y="315" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1B2733">status:</text>
  <text x="1102" y="342" text-anchor="middle" font-size="18" font-weight="700" fill="#36B37E">reviewed</text>

  <rect x="1036" y="454" width="132" height="82" rx="16" fill="#FFFFFF" stroke="#36B37E" stroke-width="3"/>
  <text x="1102" y="488" text-anchor="middle" font-size="16" font-weight="700" fill="#1B2733">발행</text>
  <text x="1102" y="513" text-anchor="middle" font-size="13" fill="#5B6B7A">wikidocs</text>

  <line x1="1102" y1="368" x2="1102" y2="450" stroke="#36B37E" stroke-width="6" marker-end="url(#ok)"/>
  <text x="1136" y="416" text-anchor="middle" font-size="12.5" fill="#36B37E">통과</text>

  <rect x="722" y="558" width="268" height="48" rx="14" fill="#FFFFFF" stroke="#E5484D" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="856" y="588" text-anchor="middle" font-size="15" font-weight="700" fill="#E5484D">하나라도 실패하면 차단</text>
  <line x1="855" y1="534" x2="855" y2="554" stroke="#E5484D" stroke-width="5" stroke-dasharray="7 6" marker-end="url(#block)"/>

  <text x="600" y="645" text-anchor="middle" font-size="16" fill="#1B2733">구조가 <tspan font-weight="700" fill="#2D6CDF">진실의 원천</tspan> — <tspan font-weight="700" fill="#36B37E">결정론 생성</tspan>과 <tspan font-weight="700" fill="#2D6CDF">4중 게이트(기계·Claude·codex·문체)</tspan>를 통과한 것만 발행된다</text>
