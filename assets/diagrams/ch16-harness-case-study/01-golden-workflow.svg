  <text x="855" y="177" text-anchor="middle" font-size="13" fill="#5B6B7A">직렬이 아니라 모두 통과해야 합류</text>

  <rect x="745" y="204" width="220" height="58" rx="14" fill="#FFFFFF" stroke="#36B37E" stroke-width="3"/>
